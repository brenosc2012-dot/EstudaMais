<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#7c5cff">
<title>EstudaMais — Aventura de Estudos</title>
<!-- PWA -->
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EstudaMais">
<style>
/* ============================================================
   ESTUDAMAIS — App de estudos gamificado (5º ano)
   Estrutura do CSS:
   1. Reset & variáveis
   2. Layout base mobile-first
   3. Componentes (botões, cards, barras)
   4. Telas do aluno
   5. Painel do professor
   6. Gamificação (XP, vidas, celebração, confete)
   7. Mascote
   8. Animações
   ============================================================ */

/* ---------- 1. RESET & VARIÁVEIS ---------- */
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --brand:#7c5cff; --brand-d:#5b3fd6;     /* cor principal do app (botões/topo) */
  --green:#58cc02; --green-d:#46a302;      /* usado só para feedback de acerto */
  --blue:#1cb0f6; --red:#ff4b4b; --yellow:#ffc800;
  --gray:#e5e5e5; --gray-d:#afafaf; --text:#3c3c3c;
  --bg:#fff; --shadow:0 4px 0 rgba(0,0,0,.15);
}
html,body{ height:100%; }
body{
  font-family:'Segoe UI',-apple-system,Roboto,'Helvetica Neue',Arial,sans-serif;
  font-size:16px; color:var(--text);
  background:#e8f4ff; line-height:1.5;
  display:flex; justify-content:center;
  overscroll-behavior:none;
}
#app{
  width:100%; max-width:480px;
  height:100vh; height:100dvh;            /* altura fixa da viewport (dvh = melhor no mobile) */
  background:var(--bg); position:relative;
  display:flex; flex-direction:column;
  box-shadow:0 0 40px rgba(0,0,0,.08);
  overflow:hidden;
}

/* ---------- 2. LAYOUT BASE ---------- */
.screen{ display:none; flex-direction:column; flex:1; min-height:0; animation:fadeIn .25s ease; }
.screen.active{ display:flex; }
.topbar{
  display:flex; align-items:center; gap:10px;
  padding:14px 16px; background:var(--bg);
  border-bottom:2px solid var(--gray); position:sticky; top:0; z-index:10;
}
.topbar h2{ font-size:18px; flex:1; }
.content{ flex:1; min-height:0; padding:16px; overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:thin; scrollbar-color:var(--brand) #ececff; }

/* ---------- MODO DEMO ---------- */
.demo-banner{ flex:0 0 auto; display:flex; align-items:center; gap:8px; background:linear-gradient(90deg,#ff8c00,#ff6b00);
  color:#fff; padding:7px 12px; font-size:12px; line-height:1.25; box-shadow:0 2px 6px rgba(0,0,0,.15); z-index:20; }
.demo-banner-txt{ flex:1; min-width:0; }
.demo-banner-txt b{ font-weight:800; }
.demo-banner-btn{ flex:0 0 auto; border:none; background:#fff; color:#e05a00; font-weight:800; font-family:inherit;
  font-size:12px; border-radius:12px; padding:6px 10px; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
.demo-banner-btn:active{ transform:translateY(1px); }
.demo-welcome{ display:flex; flex-direction:column; justify-content:center; align-items:center;
  background:linear-gradient(160deg,#7b2ff7,#3a8dde); position:relative; }
.demo-welcome-card{ width:100%; max-width:400px; }
.demo-badge{ position:absolute; top:12px; right:12px; background:#ff8c00; color:#fff; font-weight:800; font-size:11px;
  letter-spacing:.5px; padding:5px 10px; border-radius:12px; box-shadow:0 3px 8px rgba(0,0,0,.25); }
.pill-demo{ display:inline-block; background:#ff8c00; color:#fff; font-size:11px; font-weight:800; border-radius:10px; padding:2px 8px; }
/* saudação animada do aluno demo (fade-in/out por 3s) */
.demo-saud{ display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:20px;
  background:linear-gradient(160deg,#7b2ff7,#1cb0f6); color:#fff; animation:demoSaudFade 3s ease forwards; }
.demo-saud-emoji{ font-size:76px; line-height:1; animation:bounce 1s ease-in-out infinite; }
.demo-saud-txt{ font-size:30px; font-weight:800; line-height:1.25; margin:0; text-wrap:balance; text-shadow:0 2px 12px rgba(0,0,0,.22); }
@keyframes demoSaudFade{ 0%{opacity:0;transform:scale(.96);} 12%{opacity:1;transform:scale(1);} 85%{opacity:1;transform:scale(1);} 100%{opacity:0;transform:scale(1.03);} }
@media (prefers-reduced-motion:reduce){ .demo-saud{ animation:none; } .demo-saud-emoji{ animation:none; } }
/* barra de rolagem visível e colorida (navegadores WebKit/Chromium) */
.content::-webkit-scrollbar{ width:10px; }
.content::-webkit-scrollbar-track{ background:#ececff; border-radius:10px; }
.content::-webkit-scrollbar-thumb{ background:var(--brand); border-radius:10px; border:2px solid #ececff; }
.content::-webkit-scrollbar-thumb:active{ background:var(--brand-d); }
.back-btn{
  width:42px; height:42px; border:none; background:none; cursor:pointer;
  font-size:26px; color:var(--gray-d); border-radius:12px; flex-shrink:0;
}
.back-btn:active{ background:var(--gray); }

/* ---------- 3. COMPONENTES ---------- */
.btn{
  display:flex; align-items:center; justify-content:center; gap:8px;
  width:100%; min-height:52px; padding:14px 20px;
  border:none; border-radius:16px; cursor:pointer;
  font-size:17px; font-weight:700; font-family:inherit;
  color:#fff; background:var(--brand); box-shadow:0 4px 0 var(--brand-d);
  text-transform:uppercase; letter-spacing:.5px;
  transition:transform .05s, box-shadow .05s;
}
.btn:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--brand-d); }
.btn:disabled{ background:var(--gray); box-shadow:0 4px 0 var(--gray-d); color:var(--gray-d); cursor:default; }
.btn.blue{ background:var(--blue); box-shadow:0 4px 0 #1899d6; }
.btn.blue:active{ box-shadow:0 1px 0 #1899d6; }
.btn.red{ background:var(--red); box-shadow:0 4px 0 #e63939; }
.btn.orange{ background:#e67e22; box-shadow:0 4px 0 #ca6a15; }
.btn.orange:active{ box-shadow:0 1px 0 #ca6a15; }
.btn.gray{ background:#fff; color:var(--gray-d); box-shadow:0 4px 0 var(--gray); border:2px solid var(--gray); }
.btn.gray:active{ box-shadow:0 1px 0 var(--gray); }
.btn.small{ min-height:44px; font-size:14px; padding:10px 14px; width:auto; }

input,textarea,select{
  width:100%; padding:14px; font-size:16px; font-family:inherit;
  border:2px solid var(--gray); border-radius:12px; background:#f7f7f7; color:var(--text);
  margin-bottom:12px;
}
input:focus,textarea:focus,select:focus{ outline:none; border-color:var(--blue); background:#fff; }
textarea{ resize:vertical; min-height:90px; }
label{ display:block; font-weight:700; font-size:14px; margin-bottom:6px; color:#777; }

.card{
  background:#fff; border:2px solid var(--gray); border-bottom-width:4px;
  border-radius:16px; padding:16px; margin-bottom:12px; cursor:pointer;
  transition:transform .05s;
}
.card:active{ transform:scale(.98); }

/* ---------- 4. TELAS DO ALUNO ---------- */
/* Home / seleção de disciplinas */
.home-header{
  background:linear-gradient(135deg,#7c5cff 0%,#a06bff 55%,#4d9fff 100%); color:#fff;
  padding:20px 16px 24px; border-radius:0 0 24px 24px;
}
.home-header .greeting{ font-size:20px; font-weight:800; }
.home-header .sub{ font-size:14px; opacity:.9; }
.stat-row{ display:flex; gap:10px; margin-top:14px; }
.stat-pill{
  flex:1; background:rgba(255,255,255,.2); border-radius:14px;
  padding:8px; text-align:center; backdrop-filter:blur(4px);
}
.stat-pill .v{ font-size:20px; font-weight:800; }
.stat-pill .l{ font-size:11px; opacity:.9; text-transform:uppercase; }

.subj-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.subj-card{
  border-radius:18px; padding:16px 12px; color:#fff; cursor:pointer;
  box-shadow:0 4px 0 rgba(0,0,0,.18); position:relative; overflow:hidden;
  transition:transform .05s, box-shadow .05s; min-height:118px;
  display:flex; flex-direction:column; justify-content:space-between;
}
.subj-card:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.18); }
.subj-card .icon{ font-size:34px; }
.subj-card .name{ font-size:16px; font-weight:800; }
.subj-card .meta{ font-size:11px; opacity:.95; font-weight:600; }
.subj-card .lvl-badge{
  position:absolute; top:8px; right:8px; background:rgba(0,0,0,.18);
  border-radius:10px; padding:2px 8px; font-size:11px; font-weight:800;
}

/* Lista de lições */
.lesson-item{
  display:flex; align-items:center; gap:14px;
}
.lesson-item .bubble{
  width:56px; height:56px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
  font-size:26px; color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.15);
}
.lesson-item .bubble.done{ background:var(--yellow)!important; box-shadow:0 4px 0 #d9a900!important; }
.lesson-item .info{ flex:1; }
.lesson-item .info .t{ font-weight:800; font-size:16px; }
.lesson-item .info .d{ font-size:12px; color:var(--gray-d); }

/* Conteúdo da lição */
.lesson-content{ font-size:17px; line-height:1.7; white-space:pre-wrap; }
.lesson-content h1,.lesson-content h2{ margin:8px 0; }

/* Exercícios */
.exercise-top{ padding:12px 16px; display:flex; align-items:center; gap:12px; }
.progress-track{ flex:1; height:16px; background:var(--gray); border-radius:10px; overflow:hidden; }
.progress-fill{ height:100%; background:var(--green); border-radius:10px; transition:width .3s; width:0; }
.hearts{ font-size:20px; letter-spacing:2px; flex-shrink:0; }
.q-prompt{ font-size:21px; font-weight:800; margin:10px 0 20px; line-height:1.4; }
.opt{
  display:flex; align-items:center; gap:12px;
  border:2px solid var(--gray); border-bottom-width:4px; border-radius:14px;
  padding:16px; margin-bottom:12px; cursor:pointer; font-size:17px; font-weight:600;
  background:#fff; transition:transform .05s, border-color .1s, background .1s;
}
.opt:active{ transform:scale(.98); }
.opt.selected{ border-color:var(--blue); background:#ddf4ff; color:#1899d6; }
.opt.correct{ border-color:var(--green); background:#d7ffb8; color:var(--green-d); }
.opt.wrong{ border-color:var(--red); background:#ffdfe0; color:var(--red); }
.opt .letter{
  width:30px; height:30px; border-radius:8px; border:2px solid var(--gray);
  display:flex; align-items:center; justify-content:center; font-weight:800; flex-shrink:0; font-size:14px;
}
/* completar lacunas */
.fill-input{ font-size:20px; text-align:center; font-weight:700; }

/* feedback footer */
.feedback-bar{
  padding:18px 16px 24px; border-top:2px solid var(--gray);
  transition:background .2s;
}
.feedback-bar.correct{ background:#d7ffb8; }
.feedback-bar.wrong{ background:#ffdfe0; }
.feedback-msg{ display:flex; align-items:center; gap:10px; font-weight:800; font-size:18px; margin-bottom:12px; }
.feedback-bar.correct .feedback-msg{ color:var(--green-d); }
.feedback-bar.wrong .feedback-msg{ color:var(--red); }

/* Conclusão / celebração */
.celebrate{
  flex:1; min-height:0; display:flex; flex-direction:column; align-items:center;
  justify-content:center; justify-content:safe center; /* 'safe' evita cortar o topo ao rolar */
  text-align:center; padding:24px; position:relative; overflow-y:auto;
}
.celebrate h1{ font-size:30px; color:var(--yellow); margin:16px 0 8px; }
.celebrate .reward-row{ display:flex; gap:14px; margin:20px 0; }
.reward-box{
  background:#fff; border:2px solid var(--gray); border-bottom-width:4px;
  border-radius:16px; padding:14px 20px; min-width:96px;
}
.reward-box .rv{ font-size:26px; font-weight:800; }
.reward-box.xp{ color:var(--yellow); } .reward-box.xp{ border-color:#ffe699; }
.reward-box.streak{ color:var(--red); border-color:#ffc2c2; }
.medal-pop{ display:flex; align-items:center; gap:12px; background:#fffbe6; border:2px solid #ffe699;
  border-radius:14px; padding:10px 14px; margin-bottom:8px; }

/* grade de medalhas (perfil) */
.medal-grid{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.medal{ background:#fff; border:2px solid var(--gray); border-radius:14px; padding:12px 6px; text-align:center; }
.medal.locked{ opacity:.45; filter:grayscale(1); }
.medal .mi{ font-size:30px; }
.medal .mt{ font-size:11px; font-weight:700; margin-top:4px; line-height:1.2; }

/* ---------- 5. PAINEL DO PROFESSOR ---------- */
.teacher-tabs{ display:flex; border-bottom:2px solid var(--gray); background:#fff; }
.teacher-tab{
  flex:1; padding:14px 3px; text-align:center; font-weight:700; font-size:12px;
  border:none; background:none; color:var(--gray-d); cursor:pointer; border-bottom:3px solid transparent;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.teacher-tab.active{ color:var(--blue); border-bottom-color:var(--blue); }
/* ---------- CORRETOR DE PROVAS ---------- */
.corretor-dica{ background:#fff7e6; border:1px solid #ffe0a3; border-left:4px solid #ff8c00; border-radius:12px; padding:10px 12px; margin-bottom:12px; }
.corretor-dica b{ color:#e08e00; }
.corretor-capturas{ display:flex; gap:8px; flex-wrap:wrap; }
.corretor-btn{ flex:1; min-width:150px; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  background:#9b59b6; color:#fff; font-weight:800; font-size:14px; border-radius:14px; padding:14px 12px;
  cursor:pointer; box-shadow:0 4px 0 #7d3c98; -webkit-tap-highlight-color:transparent; }
.corretor-btn.galeria{ background:#1cb0f6; box-shadow:0 4px 0 #1591cc; }
.corretor-btn:active{ transform:translateY(2px); box-shadow:none; }
.corretor-thumbs{ display:flex; gap:8px; flex-wrap:wrap; margin-top:10px; }
.corretor-thumb{ position:relative; width:88px; height:88px; border-radius:10px; overflow:hidden; border:2px solid var(--gray); }
.corretor-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
.corretor-thumb button{ position:absolute; top:2px; right:2px; width:22px; height:22px; border:none; border-radius:50%;
  background:rgba(0,0,0,.6); color:#fff; font-size:12px; cursor:pointer; line-height:1; }
.corretor-tiles{ display:flex; gap:10px; margin:10px 0 4px; }
.corretor-tile{ flex:1; background:#fff; border:2px solid var(--gray); border-radius:14px; padding:12px 6px; text-align:center; }
.corretor-tile .v{ font-size:24px; font-weight:800; color:#9b59b6; line-height:1.1; }
.corretor-tile .l{ font-size:11px; color:var(--gray-d); font-weight:700; margin-top:2px; }
.corretor-q{ background:#fff; border:2px solid var(--gray); border-left-width:5px; border-radius:12px; padding:10px 12px; margin-bottom:8px; }
.corretor-acoes{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
.corretor-acoes .btn{ flex:1; min-width:140px; margin:0; }
.corretor-demobadge{ background:#fff3e0; border:1px solid #ffcc80; color:#e65100; font-size:12px; font-weight:700;
  border-radius:10px; padding:8px 10px; margin-bottom:10px; text-align:center; }
.t-lesson-row{
  display:flex; align-items:center; gap:10px; background:#fff;
  border:2px solid var(--gray); border-radius:12px; padding:12px; margin-bottom:10px;
}
.t-lesson-row .info{ flex:1; min-width:0; }
.t-lesson-row .info .t{ font-weight:800; }
.t-lesson-row .info .d{ font-size:12px; color:var(--gray-d); }
.icon-btn{
  width:40px; height:40px; border:none; border-radius:10px; background:#f0f0f0;
  font-size:18px; cursor:pointer; flex-shrink:0;
}
.icon-btn:active{ background:var(--gray); }
.ex-edit-card{
  background:#f7f7f7; border:2px solid var(--gray); border-radius:14px; padding:14px; margin-bottom:14px;
}
.opt-row{ display:flex; gap:8px; align-items:center; margin-bottom:8px; }
.opt-row input[type=text]{ margin-bottom:0; }
.opt-row .pick{ flex-shrink:0; width:40px; height:40px; }
.pill-tag{ display:inline-block; background:var(--blue); color:#fff; font-size:11px; font-weight:700; padding:3px 10px; border-radius:20px; }
.prog-bar-mini{ height:12px; background:var(--gray); border-radius:8px; overflow:hidden; margin-top:6px; }
.prog-bar-mini > div{ height:100%; border-radius:8px; }

.empty{ text-align:center; color:var(--gray-d); padding:40px 20px; }
.empty .em{ font-size:48px; }

/* Painel de geração por IA */
.ia-panel{ background:#f6effc; border:2px solid #e3d1f5; border-radius:16px; padding:14px; margin:14px 0; }
.ia-head{ display:flex; align-items:center; justify-content:space-between; }
.ia-head b{ font-size:15px; color:#7d3c98; }
.ia-erro{ background:#ffdfe0; color:#c0392b; border-radius:10px; padding:10px 12px; font-size:13px; font-weight:600; margin-bottom:10px; }
.ia-loading{ display:flex; align-items:center; justify-content:center; gap:10px; font-weight:800; color:#7d3c98; padding:14px 0; font-size:16px; }
.ia-spinner{ width:22px; height:22px; border:3px solid #e3d1f5; border-top-color:#9b59b6; border-radius:50%; display:inline-block; animation:spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* Tela de estudo (resumo por IA) */
.read-track{ height:6px; background:var(--gray); width:100%; }
.read-fill{ height:100%; width:0; transition:width .1s linear; }
.resumo-box{ background:#fff; border:2px solid var(--gray); border-radius:16px; padding:16px; font-size:17px; }
.resumo-topico{ display:flex; align-items:flex-start; gap:10px; background:#fffef6; border-radius:10px; padding:8px 10px; margin:6px 0; line-height:1.5; }
.resumo-topico .rt-ic{ flex-shrink:0; font-size:18px; }

/* Tela de explicação do erro */
.explic-resp{ background:#d7ffb8; border:2px solid var(--green); border-radius:12px; padding:12px; text-align:center; margin-bottom:14px; color:var(--green-d); }
.explic-resp b{ color:var(--green-d); }

/* divisor seção professor */
.sec-title{ font-size:13px; font-weight:800; color:var(--gray-d); text-transform:uppercase; margin:18px 0 8px; letter-spacing:.5px; }

/* ---------- 6. CONFETE ---------- */
.confetti{ position:absolute; top:-20px; width:10px; height:16px; opacity:.9; animation:fall linear forwards; z-index:5; }
.confetti{ display:flex; align-items:center; justify-content:center; }

/* ---------- MODO HISTÓRIA ---------- */
.modo-card{ display:flex; align-items:center; gap:14px; text-align:left; width:100%;
  background:#fff; border:2px solid var(--gray); border-radius:18px; padding:18px 16px;
  margin-bottom:14px; cursor:pointer; font-family:inherit; box-shadow:0 4px 0 var(--gray);
  transition:transform .05s, box-shadow .05s; }
.modo-card:active{ transform:translateY(3px); box-shadow:0 1px 0 var(--gray); }
.modo-card.historia{ border-color:#d9bfff; box-shadow:0 4px 0 #d9bfff; background:linear-gradient(#faf5ff,#fff); }
.modo-ic{ font-size:38px; line-height:1; flex-shrink:0; }
.modo-t{ font-size:18px; font-weight:800; color:#333; }
.modo-d{ font-size:13px; color:#777; margin-top:2px; line-height:1.4; }
.modo-xp{ font-size:12px; color:#fff; background:#9b59b6; border-radius:10px; padding:2px 8px; margin-left:4px; white-space:nowrap; }
.hist-cena{ height:120px; border-radius:16px; margin:6px 0 12px; display:flex; align-items:center;
  justify-content:center; overflow:hidden; box-shadow:inset 0 -20px 30px rgba(0,0,0,.15); }
.hist-cena-emojis{ font-size:40px; letter-spacing:6px; filter:drop-shadow(0 2px 3px rgba(0,0,0,.25)); animation:bob 3s ease-in-out infinite; }
@keyframes bob{ 0%,100%{ transform:translateY(0) } 50%{ transform:translateY(-8px) } }
.hist-narrativa{ background:#fff; border:2px solid #e9d9ff; border-left:6px solid #9b59b6; border-radius:12px;
  padding:12px 14px; font-size:15px; line-height:1.55; color:#444; font-style:italic; }
.hist-divisor{ text-align:center; color:#9b59b6; font-weight:800; font-size:13px; margin:14px 0 10px; letter-spacing:.5px; }
.hist-desfecho{ background:#faf5ff; border:2px solid #e9d9ff; border-radius:14px; padding:14px 16px;
  font-size:15px; line-height:1.6; color:#444; margin:10px 0; }
.hist-bounce{ animation:bounce 1s infinite; }

/* ---------- INTERPRETAÇÃO DE TEXTO ---------- */
.tipo-card{ display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left; font-family:inherit;
  background:#fff; border:2px solid var(--gray); border-radius:14px; padding:12px 14px; margin-bottom:8px; cursor:pointer; }
.tipo-card.sel{ border-color:var(--blue); background:#eaf7ff; }
.tipo-radio{ font-size:18px; color:var(--blue); line-height:1.3; }
.tipo-d{ font-size:12px; color:#777; }
.interp-textarea{ width:100%; min-height:180px; font-size:15px; line-height:1.6; padding:12px; border:2px solid var(--gray);
  border-radius:12px; font-family:inherit; resize:vertical; }

/* badge flutuante (toast) */
.toast{
  position:fixed; left:50%; transform:translateX(-50%); bottom:30px;
  background:#3c3c3c; color:#fff; padding:12px 20px; border-radius:30px;
  font-weight:700; font-size:14px; z-index:200; opacity:0; transition:opacity .3s, transform .3s;
  pointer-events:none; max-width:90%; text-align:center;
}
.toast.show{ opacity:1; transform:translateX(-50%) translateY(-6px); }

/* modal senha */

  position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:100;
  display:none; align-items:center; justify-content:center; padding:24px;
}

@keyframes fall{ to{ transform:translateY(110vh) rotate(720deg); opacity:0; } }
@keyframes shake{ 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
.shake{ animation:shake .4s; }
@keyframes pop{ 0%{transform:scale(.6);opacity:0;} 60%{transform:scale(1.1);} 100%{transform:scale(1);opacity:1;} }

// Estima a idade típica a partir do nível/ano (Fund. I começa aos ~6 anos).

  const n = nivelById(nivelId);

async function carregarChaveIA(){

// ----- Hash simples de senha (SHA-256, client-only) -----
// Barreira, não segurança real: protege contra leitura casual da senha em claro.
async function hashSenha(senha){
  const txt = String(senha==null?"":senha);
  try{
    const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
  }catch(e){
    // fallback simples caso SubtleCrypto não esteja disponível (ex.: file:// em navegador antigo)
    let h=0; for(let i=0;i<txt.length;i++){ h=((h<<5)-h+txt.charCodeAt(i))|0; }
    return "f"+(h>>>0).toString(16);
  }
}

let DATA = {};      // { subjId: [ {id,titulo,texto,exercicios:[...]} ] }
let PROFILE = {};   // alias do aluno logado (mantido por compatibilidade com a gamificação)
let SESSAO = null;     // sessão local: { tipo:"aluno"|"professor", id }
let ALUNO = null;      // doc do aluno logado (Firestore); referenciado também como PROFILE
let PROFESSOR = null;  // doc do professor logado (Firestore)
let DEMO = false;      // Modo Demo (feiras/apresentações): dados fictícios, NADA salvo no Firestore
const app = document.getElementById("app");

function uid(){ return "id" + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-3); }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function norm(s){ return String(s||"").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[̀-ͯ]/g,""); }

// ----- LIÇÕES no Firestore -----
// Documento Firestore: { disciplina, titulo, conteudo, exercicios, criadoEm, resumoIA, explicacoes }
// Lição interna no app:  { id, titulo, texto, exercicios, resumoIA, explicacoes }
// resumoIA / explicacoes guardam o conteúdo gerado pela IA para ser compartilhado entre dispositivos.
// Migração/saneamento da resposta correta de um exercício ao carregar a lição.
// O formato interno guarda `correta` como ÍNDICE em `opcoes`. Docs antigos podem ter
// vindo com `correta` como STRING (rótulo "C" ou o próprio texto), o que quebrava a
// validação. Aqui convertemos para um índice válido, priorizando o CONTEÚDO da opção.
function migrarExercicioResposta(ex){
  if(!ex || ex.tipo==="fill") return ex; // "fill" usa `resposta` (texto), já é conteúdo
  const opcoes = Array.isArray(ex.opcoes) ? ex.opcoes.map(o=>String(o)) : [];
  let c = ex.correta;
  if(typeof c === "string" && c.trim()!==""){
    ex.correta = acharIndiceCorreto(opcoes, c);        // rótulo/texto legado → índice (conteúdo primeiro)
  } else if(typeof c === "number"){
    if(c<0 || c>=opcoes.length) ex.correta = 0;        // índice fora de faixa → clampa
  } else {
    ex.correta = 0;
  }
  return ex;
}
function migrarExerciciosLicao(exs){
  return (Array.isArray(exs)?exs:[]).map(migrarExercicioResposta);
}
function licaoDeDoc(id, d){
  return {
    id,
    titulo:d.titulo||"",
    texto:d.conteudo||"",
    exercicios:migrarExerciciosLicao(d.exercicios),
    resumoIA: d.resumoIA||"",

function removeLicaoLocal(id){ SUBJECTS.forEach(s=>{ DATA[s.id]=(DATA[s.id]||[]).filter(l=>l.id!==id); }); }

let licoesUnsub = null;

// Reconstrói DATA (agrupado por disciplina) a partir de um snapshot do Firestore.
function construirDATA(snap){
  SUBJECTS.forEach(s=> DATA[s.id]=[]);
  const docs=[];
  snap.forEach(doc=> docs.push({ id:doc.id, d:doc.data() }));
  // ordena por criadoEm (mais antigo primeiro), tolerando ausência
  docs.sort((a,b)=> ((a.d.criadoEm&&a.d.criadoEm.seconds)||0) - ((b.d.criadoEm&&b.d.criadoEm.seconds)||0));
  docs.forEach(({id,d})=>{
    if(d.isDemo && !DEMO) return; // lições demo NÃO aparecem para usuários reais
    const disc = d.disciplina;
    if(!DATA[disc]) DATA[disc]=[]; // disciplina fora da lista padrão também é aceita
    DATA[disc].push(licaoDeDoc(id, d));
  });
  return docs.length;
}

// Listener em tempo real: qualquer mudança nas lições (deste ou de outro dispositivo)
// atualiza DATA e re-renderiza. A Promise resolve no primeiro snapshot (para o boot).
function ouvirLicoes(){
  if(licoesUnsub){ try{ licoesUnsub(); }catch(e){} licoesUnsub=null; }
  return new Promise((resolve, reject)=>{
    let primeiro=true;
    licoesUnsub = db.collection("licoes").onSnapshot(async snap=>{
      const total = construirDATA(snap);
      if(primeiro){
        primeiro=false;
        // primeira execução com banco vazio → semeia os exemplos uma vez
        if(total===0 && !localStorage.getItem(SEED_FLAG)){
          try{ await seedFirestore(); }catch(e){}
        }
        try{ localStorage.setItem(SEED_FLAG, "1"); }catch(e){}
        resolve();
      } else {
        aoAtualizarLicoes(); // atualização vinda do servidor (outro dispositivo, etc.)
      }
    }, err=>{
      if(primeiro){ primeiro=false; reject(err); }
    });
  });
}

// Re-renderiza ao receber atualização do servidor, sem atrapalhar o aluno/professor no meio de algo.
function aoAtualizarLicoes(){
  const t=State.tela;
  const seguro = t==="home" || t==="lessons" || t==="profile" ||
                 (t==="teacher" && Teacher.tab!=="novo" && !Teacher.gerando);
  if(seguro) render();
}

// Semeia o Firestore com as lições de exemplo (uma única vez).
async function seedFirestore(){
  const seed = seedData();
  for(const sid of Object.keys(seed)){
    for(const licao of seed[sid]){
      const ref = await db.collection("licoes").add({
        disciplina: sid,
        titulo: licao.titulo,
        conteudo: licao.texto,
        exercicios: licao.exercicios,
        criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });
      if(!DATA[sid]) DATA[sid]=[];
      DATA[sid].push({ id:ref.id, titulo:licao.titulo, texto:licao.texto, exercicios:licao.exercicios });
    }
  }
}

// Estrutura de gamificação que vive DENTRO do doc do aluno.
function novaGamificacao(){
  const g={ xpTotal:0, streak:0, ultimoDia:null, medalhas:[], premiacoes:[], som:true, disciplinas:{}, licoesConcluidas:[], historiasCompletas:[] };
  SUBJECTS.forEach(s=> g.disciplinas[s.id]={ xp:0, nivel:1, licoesConcluidas:[] });
  return g;
}
// Garante que um doc de aluno tenha todos os campos esperados (compatibilidade).
function normalizarAluno(a){
  a = a || {};
  if(typeof a.xpTotal!=="number") a.xpTotal=0;
  if(typeof a.streak!=="number") a.streak=0;
  if(!("ultimoDia" in a)) a.ultimoDia=null;
  if(!Array.isArray(a.medalhas)) a.medalhas=[];
  if(!Array.isArray(a.premiacoes)) a.premiacoes=[];
  if(!a.premiacoesInfo || typeof a.premiacoesInfo!=="object") a.premiacoesInfo={};
  if(typeof a.som!=="boolean") a.som=true;
  if(!a.disciplinas || typeof a.disciplinas!=="object") a.disciplinas={};
  SUBJECTS.forEach(s=>{ if(!a.disciplinas[s.id]) a.disciplinas[s.id]={xp:0,nivel:1,licoesConcluidas:[]}; });
  if(!Array.isArray(a.licoesConcluidas)) a.licoesConcluidas=[];
  if(!Array.isArray(a.historiasCompletas)) a.historiasCompletas=[]; // Modo História concluídas
  if(!a.nome) a.nome="Aluno(a)";
  if(!a.nivel) a.nivel="fund1";
  // NÃO forçar um ano/turma padrão: um default (ex.: "5º ano"/"A") faria o aluno ver,
  // por engano, lições de outro ano/turma. Sem valor, o filtro estrito não mostra nada
  // até o aluno definir seus dados no perfil.
  if(a.ano==null) a.ano="";
  if(a.turma==null) a.turma="";
  return a;
}

// Define o aluno logado e o expõe como PROFILE (reaproveita toda a gamificação).
function definirAlunoLogado(a){ ALUNO = normalizarAluno(a); PROFILE = ALUNO; }

// Persiste o progresso do aluno: cache local (offline) + write-through no Firestore.
function saveProfile(){
  if(DEMO){ // modo demo: progresso só no sessionStorage, nunca no Firestore
    if(ALUNO){ try{ sessionStorage.setItem(DEMO_PROGRESS_KEY, JSON.stringify(ALUNO)); }catch(_){} }
    return;
  }
  if(!ALUNO) return;
  // espelho plano de licoesConcluidas (união das disciplinas) — atende o spec/consultas
  const flat=[];
  SUBJECTS.forEach(s=>{ const d=ALUNO.disciplinas[s.id]; if(d) d.licoesConcluidas.forEach(id=>{ if(flat.indexOf(id)<0) flat.push(id); }); });
  ALUNO.licoesConcluidas = flat;
  try{ localStorage.setItem(ALUNO_CACHE_KEY, JSON.stringify({ id:ALUNO.id, doc:ALUNO })); }catch(e){}
  if(db && ALUNO.id){
    const payload = Object.assign({}, ALUNO); delete payload.id;
    try{ db.collection("alunos").doc(ALUNO.id).set(payload, { merge:true }); }catch(e){}
  }
}

   Tudo local/sessionStorage. NENHUM dado é salvo no Firestore.

// Detecta o modo demo pela URL (?demo=true) ou pelo sessionStorage (dura enquanto a aba viver).
function detectarDemo(){
  let q=false, s=false;
  try{ q = new URLSearchParams(location.search||"").get("demo")==="true"; }catch(_){ q=/[?&]demo=true(\b|&|$)/i.test(location.search||""); }
  try{ s = sessionStorage.getItem("modoDemo")==="true"; }catch(_){}
  DEMO = !!(q||s);
  if(DEMO){ try{ sessionStorage.setItem("modoDemo","true"); }catch(_){} }
  return DEMO;
}

// Módulo de ÁUDIO — gera sons via Web Audio API (sem arquivos, funciona offline)
const Sound = {
  ctx:null,
  init(){ // o AudioContext só pode iniciar após um toque do usuário
    if(this.ctx) return;
    try{ this.ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ this.ctx=null; }
  },
  // toca uma nota: freq (Hz), início (s a partir de agora), duração (s), forma de onda, volume
  tone(freq, delay, dur, type, vol){
    if(!this.ctx) return;
    const t0 = this.ctx.currentTime + (delay||0);
    const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
    osc.type = type||"sine"; osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol||0.2, t0+0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0+dur);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(t0); osc.stop(t0+dur+0.02);
  },
  play(notes){ // notes: [ [freq, delay, dur, type?, vol?], ... ]
    if(!(PROFILE && PROFILE.som)) return;
    if(this.ctx && this.ctx.state==="suspended") this.ctx.resume();
    notes.forEach(n=>this.tone(n[0],n[1],n[2],n[3],n[4]));
  },
  correct(){ this.play([[660,0,.12,"triangle",.25],[880,.10,.18,"triangle",.25]]); },
  wrong(){ this.play([[200,0,.18,"sawtooth",.18],[150,.16,.22,"sawtooth",.18]]); },
  level(){ this.play([[523,0,.12,"square",.2],[659,.12,.12,"square",.2],[784,.24,.12,"square",.2],[1047,.36,.25,"square",.22]]); },
  celebrate(){ this.play([[523,0,.14,"triangle",.25],[659,.14,.14,"triangle",.25],[784,.28,.14,"triangle",.25],[1047,.42,.3,"triangle",.28]]); },
  unlock(){ this.play([[784,0,.1,"sine",.22],[1047,.1,.1,"sine",.22],[1319,.2,.22,"sine",.24]]); },
  click(){ this.play([[440,0,.05,"sine",.12]]); }
};

// Expande abreviações e limpa o texto ANTES de mandar para a síntese de voz,
// para a leitura ficar clara e natural para crianças pequenas.
function adaptarTextoFala(t){
  let s = String(t==null?"":t);
  const L = "(?![a-zà-úA-ZÀ-Ú])"; // "não seguido de letra" — evita casar dentro de palavras
  s = s.replace(/[*#_`~]/g, " ");                      // marcadores de markdown não são falados
  s = s.replace(/N[º°]\.?/gi, "número");                // Nº / N° → número (só a forma ordinal)
  s = s.replace(new RegExp("\\bProfa\\.?"+L, "gi"), "professora"); // antes de Prof.
  s = s.replace(new RegExp("\\bProf\\.?"+L, "gi"), "professor");
  s = s.replace(new RegExp("\\bDra\\.?"+L, "gi"), "doutora");
  s = s.replace(new RegExp("\\bDr\\.?"+L, "gi"), "doutor");
  s = s.replace(new RegExp("\\bSra\\.?"+L, "gi"), "senhora");
  s = s.replace(new RegExp("\\bSr\\.?"+L, "gi"), "senhor");
  s = s.replace(new RegExp("\\bpág\\.?"+L, "gi"), "página");
  s = s.replace(/\bex\.:/gi, "exemplo:");
  s = s.replace(new RegExp("\\betc\\.?"+L, "gi"), "et cetera");
  s = s.replace(/\s{2,}/g, " ").trim();
  return s;
}

const ESTILO_PADRAO = "professora";
const ESTILOS_ORDEM = ["professora","podcast","audiolivro","robo","rapido","contadora","professora_ingles"];

// Preferências de ÁUDIO do aluno (estilo, velocidade e voz do dispositivo) — no localStorage.
// Aplicadas em TODAS as leituras (questões, resumo, explicação, texto e feedback).
const AUDIO_CFG_KEY = "audioConfig";
const VEL_MIN = 0.5, VEL_MAX = 1.5; // multiplicador manual da velocidade
const AudioCfg = {
  _cache: null,
  get(){
    if(this._cache) return this._cache;
    let c = {};
    try{ c = JSON.parse(localStorage.getItem(AUDIO_CFG_KEY) || "{}") || {}; }catch(e){}
    this._cache = {
      estilo: ESTILOS_VOZ[c.estilo] ? c.estilo : ESTILO_PADRAO,
      vel:    (typeof c.vel==="number" && c.vel>0) ? c.vel : 1.0, // multiplicador (velocidadeAudio)
      estiloManual: !!c.estiloManual, // aluno escolheu o estilo à mão? (não auto-sugerir)
      vozIndex: (typeof c.vozIndex==="number") ? c.vozIndex : null,
      vozNome:  c.vozNome || null
    };
    return this._cache;
  },
  set(patch){
    const c = Object.assign(this.get(), patch||{});
    if(typeof c.vel==="number") c.vel = Math.min(VEL_MAX, Math.max(VEL_MIN, c.vel));
    if(!ESTILOS_VOZ[c.estilo]) c.estilo = ESTILO_PADRAO;
    this._cache = c;
    try{ localStorage.setItem(AUDIO_CFG_KEY, JSON.stringify(c)); }catch(e){}
    return c;
  }
};
// Estilo atualmente selecionado (objeto).
function estiloAtual(){ return ESTILOS_VOZ[AudioCfg.get().estilo] || ESTILOS_VOZ[ESTILO_PADRAO]; }
// Pausa entre parágrafos conforme o estilo (audiolivro = 1s; demais = 0.5s).
function pausaParaEstilo(){ const e=estiloAtual(); return (typeof e.pausaEntreParagrafos==="number")?e.pausaEntreParagrafos:500; }
// Processa o texto conforme o estilo (após a limpeza padrão de abreviações).
function processarEstiloTexto(t){
  const base = adaptarTextoFala(t);
  try{ const e=estiloAtual(); return (typeof e.processarTexto==="function") ? e.processarTexto(base) : base; }
  catch(_){ return base; }
}
// Substitui {titulo} pelo título da lição atual (usado no intro do estilo Podcast).
function textoEstiloComTitulo(txt){

  const l=(typeof getLesson==="function") ? getLesson() : null;
  const titulo=(l && (l.tituloTexto||l.titulo)) || "esta lição";
  return txt.replace(/\{titulo\}/g, titulo);

// Aplica estilo (rate = base*vel, pitch, volume) + voz do dispositivo à utterance.
function aplicarEstiloVoz(u, opts){
  opts=opts||{};
  const est=estiloAtual(); const cfg=AudioCfg.get(); const voz=Fala.vozAtual();
  if(voz){ u.voice=voz; u.lang=voz.lang||"pt-BR"; } else { u.lang="pt-BR"; }
  let rate = (est.rate||1) * (cfg.vel||1);
  if(opts.animado) rate *= 1.06;               // pequeno realce nos trechos "animados"
  u.rate  = Math.min(2, Math.max(0.3, rate));
  u.pitch = opts.animado ? Math.min(2, (est.pitch||1)+0.1) : (est.pitch||1);
  u.volume = (typeof est.volume==="number") ? est.volume : 1;
}

// Nome amigável de uma voz (tira prefixos de fabricante e sufixos técnicos).
function nomeAmigavelVoz(v){
  let n = String((v&&v.name) || "Voz");
  n = n.replace(/^(Microsoft|Google|Apple)\s+/i, "");
  n = n.split(/\s[-–—]\s|\(/)[0].trim();
  return n || String((v&&v.name) || "Voz");
}

// Módulo de LEITURA EM VOZ ALTA (TTS) — Web Speech API, sem arquivos, offline.
// Fala uma SEQUÊNCIA de trechos com pausas controladas (encadeando utterances),
// com voz infantil (lenta e um pouco mais aguda) e voz feminina pt-BR se houver.
const Fala = {
  ok(){ return typeof window!=="undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined"; },
  voz: null,
  _fila: [],
  _tocando: false,
  _timer: null,
  _protegerUmaVez: false, // deixa a próxima troca de tela NÃO cancelar a fala (feedback ao errar)
  // escolhe voz FEMININA em pt-BR quando disponível (ex.: Google português do Brasil, Luciana)
  escolherVoz(){
    try{
      const vs = window.speechSynthesis.getVoices() || [];
      if(!vs.length) return null;
      const br = vs.filter(v=>/pt[-_]BR/i.test(v.lang));
      const pt = vs.filter(v=>/^pt/i.test(v.lang));
      const cand = (br.length?br:pt);
      if(!cand.length) return null;
      const femininas = /luciana|francisca|maria|fernanda|vit[oó]ria|joana|ana|helena|female|feminin|google/i;
      return cand.find(v=>femininas.test(v.name)) || cand[0];
    }catch(e){ return null; }
  },
  // resolve a voz configurada pelo aluno (por nome, depois índice) ou escolhe uma pt-BR.
  vozAtual(){
    const cfg = AudioCfg.get();
    try{
      const vs = window.speechSynthesis.getVoices() || [];
      if(cfg.vozNome){ const byName = vs.find(v=>v.name===cfg.vozNome); if(byName) return byName; }
      if(cfg.vozIndex!=null && vs[cfg.vozIndex]) return vs[cfg.vozIndex];
    }catch(e){}
    if(!this.voz) this.voz = this.escolherVoz();
    return this.voz;
  },
  // aplica o estilo de voz + velocidade + voz do dispositivo (com realce p/ trechos "animados")
  _config(u, animado){ aplicarEstiloVoz(u, { animado:!!animado }); },
  // Fala uma lista de segmentos: [{texto, pausa(ms), animado?}, ...]
  falarSequencia(segmentos){
    if(!this.ok()) return;
    this.parar();
    this._fila = (segmentos||[]).filter(s=>s && s.texto!=null);
    this._tocando = true;
    atualizarBotoesFala();
    this._proximo();
  },
  _proximo(){
    if(!this._fila.length){ this._tocando=false; this._protegerUmaVez=false; atualizarBotoesFala(); return; }
    const seg = this._fila.shift();
    const texto = processarEstiloTexto(seg.texto);
    if(!texto){ this._agendar(seg.pausa||0); return; }
    try{
      const u = new SpeechSynthesisUtterance(texto.slice(0,4000));
      this._config(u, !!seg.animado);
      const seguir = ()=> this._agendar(seg.pausa||0);
      u.onend = seguir; u.onerror = seguir;
      window.speechSynthesis.speak(u);
    }catch(e){ this._agendar(0); }
  },
  _agendar(pausaMs){
    clearTimeout(this._timer);
    this._timer = setTimeout(()=>this._proximo(), Math.max(0, pausaMs||0));
  },
  // atalho para falar um texto único (resumo/explicação/feedback)
  ler(texto, animado){ this.falarSequencia([{ texto, pausa:0, animado:!!animado }]); },
  parar(){
    clearTimeout(this._timer); this._fila=[]; this._tocando=false;
    if(this.ok()){ try{ window.speechSynthesis.cancel(); }catch(e){} }
    atualizarBotoesFala();
  },
  falando(){ try{ return !!this._tocando || (this.ok() && window.speechSynthesis.speaking); }catch(e){ return false; } }
};

// Monta os segmentos de leitura de uma questão, com pausas didáticas.
function segmentosQuestao(ex){
  if(!ex) return [];
  // frase de abertura da persona (ex.: Professora "Agora veja esta questão:")
  const antes = estiloAtual().antesQuestao;
  const abertura = antes ? [{ texto: antes, pausa: 400 }] : [];
  if(ex.tipo==="fill"){
    // lê o enunciado trocando a lacuna (___) por "lacuna"
    const enun = String(ex.enunciado||"").replace(/_{1,}/g, " lacuna ");
    return abertura.concat([{ texto: enun, pausa: 0 }]);
  }
  const segs = abertura.concat([{ texto: ex.enunciado||"", pausa: 1000 }]); // (abertura) + enunciado + pausa 1s
  if(ex.tipo==="vf"){
    segs.push({ texto: "A afirmação é verdadeira ou falsa?", pausa: 0 });
    return segs;
  }
  // múltipla escolha: "As opções são:" (pausa 0.5s) + cada opção (pausa 0.8s)
  segs.push({ texto: "As opções são:", pausa: 500 });
  (ex.opcoes||[]).forEach((o,i)=>{
    segs.push({ texto: `Opção ${String.fromCharCode(65+i)}: ${o}`, pausa: 800 });
  });
  return segs;
}
function lerResumo(){ if(Fala.falando()){ Fala.parar(); return; } Fala.ler((State.estudo && State.estudo.texto) || ""); }
function lerQuestao(){
  if(Fala.falando()){ Fala.parar(); return; }
  const ex = Sess && Sess.exercicios && Sess.exercicios[Sess.idx];
  if(!ex) return;
  Fala.falarSequencia(segmentosQuestao(ex));
}
function lerExplicacao(){

  Fala.falarSequencia([

}
// Fala o conteúdo da alternativa selecionada ("Você escolheu a letra A: ...").
function falarSelecao(ex, i){

const XP_POR_NIVEL = 50;       // XP necessário por nível em cada disciplina
const XP_POR_ACERTO = 10;      // XP padrão (questões antigas, sem dificuldade)
const XP_BONUS_LICAO = 20;     // bônus ao concluir lição
// XP por acerto conforme a dificuldade da questão (item 6)
const XP_POR_DIFICULDADE = { facil:10, intermediario:20, dificil:30 };
function xpDaQuestao(ex){ return (ex && XP_POR_DIFICULDADE[ex.nivel]) || XP_POR_ACERTO; }
// Ordem crescente de dificuldade (questões sem nível ficam no meio, ordem estável)
const ORDEM_NIVEL = { facil:0, intermediario:1, dificil:2 };
function ordenarPorDificuldade(arr){
  return arr.map((ex,i)=>({ex,i})).sort((a,b)=>{
    const na = ORDEM_NIVEL[a.ex.nivel]!==undefined ? ORDEM_NIVEL[a.ex.nivel] : 1;
    const nb = ORDEM_NIVEL[b.ex.nivel]!==undefined ? ORDEM_NIVEL[b.ex.nivel] : 1;
    return na-nb || a.i-b.i;
  }).map(o=>o.ex);
}
function nivelDificuldadeLabel(n){ return n==="facil"?"Fácil":(n==="intermediario"?"Intermediário":(n==="dificil"?"Difícil":"")); }
function nivelDificuldadeCor(n){ return n==="facil"?"#58cc02":(n==="intermediario"?"#ffa502":(n==="dificil"?"#ff4b4b":"#afafaf")); }

function nivelDe(xp){ return Math.floor(xp / XP_POR_NIVEL) + 1; }
function xpNoNivel(xp){ return xp % XP_POR_NIVEL; }

// Atualiza streak diário com base na data
function atualizarStreak(){
  const hoje = new Date().toDateString();
  if(PROFILE.ultimoDia === hoje) return; // já contado hoje
  const ontem = new Date(Date.now()-86400000).toDateString();
  if(PROFILE.ultimoDia === ontem) PROFILE.streak += 1;
  else PROFILE.streak = 1;
  PROFILE.ultimoDia = hoje;
  saveProfile();
}

// Concede recompensas ao concluir uma lição (xpAcertos = soma do XP por dificuldade)
function concederRecompensa(subjId, lessonId, xpAcertos){
  const d = PROFILE.disciplinas[subjId];
  const ganho = xpAcertos + XP_BONUS_LICAO;
  const nivelAntes = nivelDe(d.xp);
  d.xp += ganho;
  PROFILE.xpTotal += ganho;
  if(d.licoesConcluidas.indexOf(lessonId)<0) d.licoesConcluidas.push(lessonId);
  d.nivel = nivelDe(d.xp);
  atualizarStreak();
  saveProfile();
  return { ganho, subiuNivel: nivelDe(d.xp)>nivelAntes, nivel:d.nivel };
}

// Estatísticas agregadas do progresso (usadas pelas medalhas e telas)
function statsProgresso(){
  let totalConcl=0, discComConcl=0, nivelMax=1;
  SUBJECTS.forEach(s=>{
    const d=PROFILE.disciplinas[s.id];
    const vis=licoesDoAluno(s.id);
    const f=d.licoesConcluidas.filter(id=>vis.some(l=>l.id===id)).length;
    totalConcl+=f; if(f>0) discComConcl++; if(d.nivel>nivelMax) nivelMax=d.nivel;
  });
  return { totalConcl, discComConcl, nivelMax };
}

// Verifica e desbloqueia novas medalhas. ctx={perfeito:bool}. Retorna as recém-conquistadas.
function verificarMedalhas(ctx){
  ctx=ctx||{}; const s=statsProgresso(); const novas=[];
  ACHIEVEMENTS.forEach(a=>{
    if(PROFILE.medalhas.indexOf(a.id)>=0) return;
    if(a.check(PROFILE, s, ctx)){ PROFILE.medalhas.push(a.id); novas.push(a); }
  });
  if(novas.length) saveProfile();
  return novas;
}

let PREMIACOES = []; // premiações disponíveis carregadas do Firestore para o aluno
async function carregarPremiacoes(){
  PREMIACOES = [];
  if(!db || !ALUNO) return;
  try{
    const snap = await db.collection("premiacoes").get();
    snap.forEach(d=> PREMIACOES.push(Object.assign({ id:d.id }, d.data())));
  }catch(e){ PREMIACOES=[]; }
}
function agoraSeg(){ return Math.floor(Date.now()/1000); }
function premiacaoAplicavel(pr){
  if(pr.turma && pr.turma!==ALUNO.turma) return false;
  if(pr.expiracaoEm && pr.expiracaoEm.seconds && pr.expiracaoEm.seconds < agoraSeg()) return false;
  return true;
}
function premiacaoAtingida(pr, ctx){
  const v = Number(pr.valorMinimo)||0;
  if(pr.criterio==="pontuacao")  return (ALUNO.xpTotal||0) >= v;
  if(pr.criterio==="atividades") return (ALUNO.licoesConcluidas||[]).length >= v;
  if(pr.criterio==="acertos")    return ctx && ctx.pctAcertos!=null && ctx.pctAcertos >= v;
  return false;
}
// Avalia as premiações e concede as recém-atingidas (grava em premiacoes_alunos).
async function avaliarPremiacoes(ctx){
  if(!db || !ALUNO || !PREMIACOES.length) return [];
  ALUNO.premiacoes = ALUNO.premiacoes||[];
  ALUNO.premiacoesInfo = ALUNO.premiacoesInfo||{};
  const novas=[];
  for(const pr of PREMIACOES){
    if(ALUNO.premiacoes.indexOf(pr.id)>=0) continue;
    if(!premiacaoAplicavel(pr)) continue;
    if(!premiacaoAtingida(pr, ctx)) continue;
    ALUNO.premiacoes.push(pr.id);
    ALUNO.premiacoesInfo[pr.id] = { nome:pr.nome||"Prêmio", icone:pr.icone||"🏆", descricao:pr.descricao||"" };
    novas.push(pr);
    try{ await db.collection("premiacoes_alunos").doc(ALUNO.id+"_"+pr.id).set({
      alunoId:ALUNO.id, premiacaoId:pr.id, conquistadoEm:firebase.firestore.FieldValue.serverTimestamp() }); }catch(e){}
  }
  if(novas.length) saveProfile();
  return novas;
}

// Busca alunos por nome de forma tolerante (ignora maiúsculas/acentos/espaços).
async function buscarAlunosPorNome(nomeInput){
  const alvo = norm(nomeInput);
  let snap = await db.collection("alunos").where("nomeNorm","==",alvo).get();       // contas novas/migradas
  if(!snap.empty) return snap.docs;
  snap = await db.collection("alunos").where("nome","==",(nomeInput||"").trim()).get(); // legado (nome exato)
  if(!snap.empty) return snap.docs;
  const all = await db.collection("alunos").get();                                  // legado tolerante (varredura)
  return all.docs.filter(d=> norm((d.data()||{}).nome)===alvo);
}
async function submitLoginAluno(){
  const nome=val('laNome').trim(), senha=val('laSenha');
  if(!nome||!senha){ State.authErro="Informe nome e senha."; render(); return; }
  State.authBusy=true; State.authErro=""; render();
  try{
    const docs = await buscarAlunosPorNome(nome);
    if(!docs.length) throw new Error("nao_encontrado");
    const h = await hashSenha(senha);
    let achou=null;
    docs.forEach(d=>{ if(!achou && d.data().senha===h) achou={ id:d.id, data:d.data() }; });
    if(!achou) throw new Error("senha");
    // backfill do campo normalizado em contas antigas (acelera logins futuros)
    if(!achou.data.nomeNorm){ try{ db.collection("alunos").doc(achou.id).set({ nomeNorm:norm(achou.data.nome||"") }, { merge:true }); }catch(_){} }
    const doc = Object.assign({}, achou.data, { id:achou.id }); delete doc.criadoEm;
    definirAlunoLogado(doc);
    SESSAO={ tipo:"aluno", id:achou.id }; salvarSessao();
    State.authBusy=false; State.tela="home"; render(); inicializarAluno();
  }catch(e){
    State.authBusy=false;
    State.authErro = e.message==="nao_encontrado" ? "Aluno não encontrado." : (e.message==="senha" ? "Senha incorreta." : "Erro ao entrar. Verifique a conexão.");
    render();
  }
}

// ----- Escopo de lições: o aluno só vê as da sua turma E ano -----
// ESCOPO OBRIGATÓRIO (estrito): a lição SÓ aparece para o aluno se tiver ano E turma
// definidos e IGUAIS aos do aluno. Lição sem ano ou sem turma NÃO aparece para ninguém
// (evita vazamento de lições de outros anos/turmas). Comparação normalizada
// (trim + minúsculas + acentos via norm) para casar mesmo com dados inconsistentes.
// O nível é opcional na comparação porque o rótulo do ano já é único entre os níveis
// (ex.: "1º ano" só existe no Fund. I; o Médio usa "1º ano EM").
function mesmaTurma(a,b){ return norm(a)===norm(b); }
function mesmoAno(a,b){ return norm(a)===norm(b); }
function licaoVisivelPara(l, aluno){
  aluno = aluno || {};
  const anoL=norm(l.ano), anoA=norm(aluno.ano);
  const turmaL=norm(l.turma), turmaA=norm(aluno.turma);
  const nivelL=norm(l.nivel), nivelA=norm(aluno.nivel);
  const okAno   = anoL!=="" && anoL===anoA;      // ano obrigatório e igual
  const okTurma = turmaL!=="" && turmaL===turmaA; // turma obrigatória e igual
  const okNivel = nivelL==="" || nivelL===nivelA; // nível opcional
  return okAno && okTurma && okNivel;
}
// Diagnóstico — rode App.diagLicoes() no console do navegador para ver, lição a lição,
// os valores EXATOS comparados (ano/turma da lição vs do aluno) e o resultado do match.
function diagLicoes(){
  if(!ALUNO){ console.log('⚠️ Nenhum aluno logado.'); return; }
  console.log('=== Aluno:', ALUNO.nome,
    '| ano:', JSON.stringify(ALUNO.ano),
    '| turma:', JSON.stringify(ALUNO.turma),
    '| nível:', JSON.stringify(ALUNO.nivel));
  let total=0, visiveis=0;
  SUBJECTS.forEach(s=>{
    (DATA[s.id]||[]).forEach(l=>{
      total++;
      const v = licaoVisivelPara(l, ALUNO);
      if(v) visiveis++;
      console.log(`[${s.id}] ${l.titulo}`);
      console.log('  Lição ano:', JSON.stringify(l.ano), '| Aluno ano:', JSON.stringify(ALUNO.ano));
      console.log('  Lição turma:', JSON.stringify(l.turma), '| Aluno turma:', JSON.stringify(ALUNO.turma));
      console.log('  Match:', norm(l.ano)===norm(ALUNO.ano) && norm(l.turma)===norm(ALUNO.turma), '| Visível:', v);
    });
  });
  console.log(`=== ${visiveis}/${total} lições visíveis para ${ALUNO.nome}`);
}
function licaoVisivel(l){ return ALUNO ? licaoVisivelPara(l, ALUNO) : true; }
function licoesDoAluno(subjId){ return (DATA[subjId]||[]).filter(licaoVisivel); }

  try{
    db.collection("licoes_geradas").doc(licaoId).set(Object.assign({
      licaoId, geradoEm: firebase.firestore.FieldValue.serverTimestamp(), geradoPor: deviceId()
    }, dados), { merge:true });
  }catch(e){ /* best-effort */ }
}
function limparLicaoGerada(licaoId){
  if(!db || !licaoId) return;
  try{ db.collection("licoes_geradas").doc(licaoId).delete(); }catch(e){}
}

// ----- TELA DE ESTUDO (resumo gerado por IA, antes das atividades) -----
function getLesson(){ return (DATA[State.subj]||[]).find(l=>l.id===State.lesson); }

async function openLesson(lid){
  clearInterval(estudoTimer);
  State.lesson=lid; State.tela="study";
  const l=getLesson();
  if(!l){ goHome(); return; }

  // sugere o estilo de voz conforme a disciplina (Inglês → Prof. de Inglês), a menos
  // que o aluno já tenha escolhido um estilo manualmente
  sugerirEstiloPorDisciplina(State.subj);

  // pré-gera as explicações de erro em segundo plano (só em aparelho com a chave),
  // para que qualquer dispositivo já encontre a explicação pronta no Firestore
  if(iaConfigurada()) pregerarExplicacoes(l);

  // Lição de interpretação: vai direto para a tela de leitura do texto (sem resumo IA)
  if(l.tipo==="interpretacao_texto"){ State.tela="interpRead"; State._interpLido=false; render(); return; }

  // 1) cache em memória desta sessão
  if(resumoCache[lid]){ State.estudo={ status:"ok", texto:resumoCache[lid] }; render(); return; }

  // mostra a tela de carregamento enquanto consultamos o cache na nuvem
  State.estudo={ status:"loading" }; render();
  const ativo=()=> State.tela==="study" && State.lesson===lid;

  // 2) cache compartilhado no Firestore (licoes_geradas) → reaproveita sem chamar a IA
  const cache = await getLicaoGerada(lid);
  if(cache && cache.resumo && String(cache.resumo).trim()){
    resumoCache[lid]=cache.resumo;
    if(ativo()){ State.estudo={ status:"ok", texto:cache.resumo }; render(); }
    return;
  }
  // 2b) legado: resumo salvo no próprio doc da lição → usa e migra para o novo cache
  if(l.resumoIA && l.resumoIA.trim()){
    resumoCache[lid]=l.resumoIA;
    salvarLicaoGerada(lid, { resumo:l.resumoIA, exercicios:l.exercicios });
    if(ativo()){ State.estudo={ status:"ok", texto:l.resumoIA }; render(); }
    return;
  }
  // Modo demo: se não há IA, usa o resumo pré-cadastrado (nunca mostra erro de API)
  const fallbackDemo = ()=> ({ status:"demo", texto:(l.resumoDemo || l.texto || "") });
  // 3) sem chave neste aparelho → resumo pré-cadastrado (demo) ou conteúdo do professor
  if(!iaConfigurada()){ if(ativo()){ State.estudo = DEMO ? fallbackDemo() : { status:"fallback", texto:l.texto }; render(); } return; }

  // 4) gera o resumo pela IA e salva no cache compartilhado (licoes_geradas)
  const pub = descreverPublico(ALUNO);
  const materialAluno = (l.materialTexto||"").trim();
  const blocoMaterialAluno = materialAluno ? `\nMATERIAL ANEXADO: ${materialAluno}` : "";
  const prompt =
`Crie um resumo didático para uma criança de aproximadamente ${pub.idade} anos (${pub.ano} do ${pub.nivel}) baseado no material abaixo.
Use linguagem simples e animada, exemplos do cotidiano e destaque os pontos principais em tópicos.
O resumo deve ter no máximo 300 palavras e terminar com uma dica de memorização.
${pub.frase}
CONTEÚDO DA LIÇÃO: ${l.texto}${blocoMaterialAluno}`;
  try{
    const texto = await chamarIA(prompt, 20000);
    if(!texto.trim()) throw new Error("vazio");
    resumoCache[lid]=texto;
    salvarLicaoGerada(lid, { resumo:texto, exercicios:l.exercicios });
    if(ativo()){ State.estudo={ status:"ok", texto }; render(); }
  }catch(e){
    // nunca exibe erro de API no demo — cai no resumo pré-cadastrado
    if(ativo()){ State.estudo = DEMO ? fallbackDemo() : { status:"fallback", texto:l.texto }; render(); }
  }
}

// Seção colapsável listando os documentos que o professor usou como base (tela de estudo).

function materialApoioAluno(l){

  return `<details style="margin-top:14px;background:#fff;border:2px solid var(--gray);border-radius:14px;padding:2px 14px">

// Como formatResumo, mas cada parágrafo/tópico vira um bloco com id (spar-i) para leitura+destaque.
// Os índices batem com paragrafosTexto(), usado pela leitura em voz alta.
function formatResumoLeitor(txt){
  const paras=paragrafosTexto(txt);
  if(!paras.length) return formatResumo(txt);
  return paras.map((p,i)=>{
    const m=p.match(/^[-•*]\s+(.*)$/);
    const inner = m ? `<span class="rt-ic">⭐</span><span>${esc(m[1])}</span>` : `<span>${esc(p)}</span>`;
    const extra = m ? ' resumo-topico' : '';
    return `<div class="leitor-par${extra}" id="spar-${i}">${inner}</div>`;
  }).join("");
}

// barra de progresso de leitura + contagem regressiva de 10s do botão
function setupEstudoScreen(btnLabel, cor){
  const cont=document.getElementById("estudoContent");
  const bar=document.getElementById("estudoProg");
  if(cont && bar){
    const upd=()=>{ const max=cont.scrollHeight-cont.clientHeight; bar.style.width=(max>4?(cont.scrollTop/max*100):100)+"%"; };
    cont.addEventListener("scroll", upd); upd();
  }
  const btn=document.getElementById("btnEstudei");
  const cnt=document.getElementById("estudoCount");
  let restante=10;
  clearInterval(estudoTimer);
  estudoTimer=setInterval(()=>{
    restante--;
    if(restante<=0){
      clearInterval(estudoTimer);
      if(btn){ btn.disabled=false; btn.innerHTML="✅ "+btnLabel; }
    } else if(cnt){ cnt.textContent=restante; }
  },1000);
  // Auto-leitura opcional do resumo (uma vez por visita à lição)
  const l=getLesson();
  if(l && autoLerLigado() && Fala.ok() && !LeitorTexto.ativo && State._autoResumoLid!==l.id){
    State._autoResumoLid=l.id;
    agendarAutoLeituraResumo();

}

// transforma o texto do resumo em HTML, destacando tópicos com ⭐
function formatResumo(txt){
  return String(txt||"").split("\n").map(raw=>{
    const t=raw.trim();
    if(!t) return `<div style="height:8px"></div>`;
    const m=t.match(/^[-•*]\s+(.*)$/);
    if(m) return `<div class="resumo-topico"><span class="rt-ic">⭐</span><span>${esc(m[1])}</span></div>`;
    return `<p style="margin:8px 0;line-height:1.6">${esc(t)}</p>`;
  }).join("");
}

function renderExercise(){
  const s=subjById(State.subj);
  const ex = Sess.exercicios[Sess.idx];
  const progresso = (Sess.idx / Sess.total)*100;
  const hearts = "❤️".repeat(Sess.vidas) + "🤍".repeat(3-Sess.vidas);

  let body="";
  if(ex.tipo==="fill"){
    body = `<input type="text" class="fill-input" id="fillAns" placeholder="Digite aqui..." autocomplete="off"
              ${Sess.respondido?'disabled':''} oninput="App.onFillInput()">`;
  } else {
    const opcoes = ex.opcoes||[];
    body = opcoes.map((o,i)=>{
      let cls="opt";
      if(Sess.respondido){
        if(i===ex.correta) cls+=" correct";
        else if(i===Sess.selecionado) cls+=" wrong";
      } else if(Sess.selecionado===i) cls+=" selected";
      const letra = ex.tipo==="vf" ? (i===0?'V':'F') : String.fromCharCode(65+i);
      return `<div class="${cls}" onclick="App.selectOpt(${i})">
        <span class="letter">${letra}</span><span>${esc(o)}</span></div>`;
    }).join("");
  }

  // rodapé: ou botão verificar, ou feedback
  let footer;
  if(Sess.respondido){
    const ok=Sess.acertouAtual;
    let respCorreta = ex.tipo==="fill" ? ex.resposta : (ex.opcoes? ex.opcoes[ex.correta]:"");
    if(ok){
      footer = `<div class="feedback-bar correct">
        <div class="feedback-msg">🎉 Muito bem!</div>
        <button class="btn" onclick="App.nextExercise()">Continuar</button>
      </div>`;
    } else {
      // ao errar: feedback vermelho + carregando explicação (a tela de explicação assume em seguida)
      footer = `<div class="feedback-bar wrong">
        <div class="feedback-msg">😕 Ops! Resposta certa: <span style="text-decoration:underline">${esc(respCorreta)}</span></div>
        <button class="btn red" disabled><span class="ia-spinner" style="width:18px;height:18px;border-top-color:#fff;border-color:rgba(255,255,255,.4);vertical-align:middle"></span> Gerando explicação...</button>
      </div>`;
    }
  } else {
    const dis = (ex.tipo==="fill") ? '' : (Sess.selecionado===null?'disabled':'');
    footer = `<div class="feedback-bar">
      <button class="btn" id="checkBtn" ${dis} onclick="App.checkAnswer()">Verificar</button>
    </div>`;
  }

  app.innerHTML = `<div class="screen active">
    <div class="exercise-top">
      <button class="back-btn" onclick="App.confirmQuit()">✕</button>
      <div class="progress-track"><div class="progress-fill" style="width:${progresso}%;background:${s.cor}"></div></div>
      <div class="hearts">${hearts}</div>
    </div>
    <div class="content">
      <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--gray-d);font-weight:700;margin-bottom:8px">
        <span>Questão ${Sess.idx+1} de ${Sess.total}</span>
        <span>✅ ${Sess.acertos} acerto${Sess.acertos===1?'':'s'}</span>
      </div>
      <div style="margin-bottom:6px;display:flex;gap:6px;align-items:center;flex-wrap:wrap">
        <span class="pill-tag" style="background:${s.cor}">${tipoLabel(ex.tipo)}</span>
        ${ex.nivel?`<span class="pill-tag" style="background:${nivelDificuldadeCor(ex.nivel)}">${nivelDificuldadeLabel(ex.nivel)} • +${xpDaQuestao(ex)} XP</span>`:''}
        ${(getLesson()&&getLesson().tipo==="interpretacao_texto")?`<button class="btn blue small" style="width:auto;margin-left:auto;padding:6px 10px" onclick="App.abrirTextoInterp()">📖 Ver o texto</button>`:''}
      </div>
      ${Fala.ok()?`<div style="display:flex;justify-content:flex-end;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:6px">${estiloMiniHtml()}${velocidadeMiniHtml()}</div>`:''}
      <div class="q-prompt">${esc(ex.enunciado)}</div>
      ${Fala.ok()?`<div style="text-align:center;margin:-4px 0 14px">${botaoFala('lerQuestao','Ouvir a pergunta')}</div>`:''}
      <div id="optWrap">${body}</div>

}
function tipoLabel(t){ return t==="mc"?"Múltipla escolha":(t==="vf"?"Verdadeiro ou Falso":"Complete a lacuna"); }

function selectOpt(i){
  if(Sess.respondido) return;
  Sess.selecionado=i; (Sess && Sess.modo==="historia") ? renderHistoria() : renderExercise();
  // lê em voz alta a alternativa escolhida antes de confirmar
  falarSelecao(Sess.exercicios[Sess.idx], i);
}
function onFillInput(){
  const v=document.getElementById("fillAns");
  const btn=document.getElementById("checkBtn");
  if(btn) btn.disabled = !v.value.trim();
}

function checkAnswer(){
  const ex=Sess.exercicios[Sess.idx];
  let ok=false;
  if(ex.tipo==="fill"){
    const resp=document.getElementById("fillAns").value;
    if(!resp.trim()) return;
    Sess.respAluno=resp;
    ok = norm(resp)===norm(ex.resposta);
    console.log('Selecionado:', resp);
    console.log('Correto:', ex.resposta);
    console.log('Resultado:', ok);
  } else {
    if(Sess.selecionado===null) return;
    // Validação por CONTEÚDO da alternativa (não pelo rótulo A/B/C/D nem só pelo índice):
    // compara o texto da opção escolhida com o texto da opção correta.
    const opcoes = ex.opcoes || [];
    const conteudoSelecionado = opcoes[Sess.selecionado];
    const conteudoCorreto = opcoes[ex.correta];
    Sess.respAluno = conteudoSelecionado || "";
    ok = norm(conteudoSelecionado)===norm(conteudoCorreto);
    console.log('Selecionado:', conteudoSelecionado);
    console.log('Correto:', conteudoCorreto);
    console.log('Resultado:', ok);
  }
  Sess.respondido=true; Sess.acertouAtual=ok;
  // registra para a revisão ao final da lição
  Sess.revisao.push({
    enunciado: ex.enunciado, tipo: ex.tipo, nivel: ex.nivel,
    correta: ex.tipo==="fill" ? (ex.resposta||"") : (ex.opcoes? ex.opcoes[ex.correta] : ""),
    resp: Sess.respAluno, ok: ok
  });
  const xpQ = Math.round(xpDaQuestao(ex) * (Sess.xpMult||1)); // Modo História: +50%
  if(Sess.modo==="historia"){ responderHistoria(ok, ex, xpQ); return; }
  const estilo = estiloAtual();
  if(ok){
    Sess.acertos++; Sess.xpGanho += xpQ; Sound.correct(); renderExercise();
    Fala.ler(estilo.acerto || "Muito bem! Você acertou!", true); // frase da persona, voz animada
  } else {
    Sess.erros++; Sess.vidas--; Sound.wrong(); renderExercise();
    const wrap=document.getElementById("optWrap");
    if(wrap) wrap.classList.add("shake");
    // feedback falado ao errar (frase da persona + resposta certa) — protegido p/ não ser cortado
    const respCorreta = ex.tipo==="fill" ? (ex.resposta||"") : (ex.opcoes? ex.opcoes[ex.correta] : "");
    Fala._protegerUmaVez = true;
    Fala.ler((estilo.erro || "Ops!") + " A resposta certa era: " + respCorreta + ".");
    // mostra o feedback vermelho por um instante e então gera a explicação por IA
    setTimeout(()=>gerarExplicacao(), 950);
  }
}

function nextExercise(){
  if(Sess.idx < Sess.total-1){
    Sess.idx++; Sess.respondido=false; Sess.acertouAtual=false; Sess.selecionado=null; Sess.respAluno="";
    // volta a tela para "exercise" (vinha de "explain"); senão a próxima geração
    // de explicação seria bloqueada pela guarda State.tela!=="exercise".
    State.tela="exercise";
    renderExercise();
    agendarAutoLeitura();
  } else {
    // concluiu todos
    finishLesson();
  }
}

// ----- EXPLICAÇÃO DO ERRO (gerada por IA) -----
const IA_EXPLIC_TIMEOUT = 10000; // 10s: se a IA não responder, mostra explicação padrão
let explicacaoEmAndamento = false; // evita chamadas simultâneas à IA
async function gerarExplicacao(){
  // se o aluno saiu da atividade nesse meio tempo, não faz nada
  if(State.tela!=="exercise" || !Sess || Sess.acertouAtual) return;
  // já existe uma geração em andamento → não dispara outra (evita loop/concorrência)
  if(explicacaoEmAndamento) return;
  const l=getLesson();
  if(!l || !Sess.exercicios || !Sess.exercicios[Sess.idx]){
    mostrarExplicacao("Tudo bem errar — faz parte do aprendizado! 😊 Releia o resumo com calma e tente de novo. Você consegue! 💪", "");
    return;
  }
  const ex=Sess.exercicios[Sess.idx];
  const exId = ex.id;
  const respCorreta = ex.tipo==="fill" ? (ex.resposta||"") : (ex.opcoes? ex.opcoes[ex.correta] : "");
  const padrao = "Tudo bem errar — é assim que a gente aprende! 😊 A resposta certa é \""+respCorreta+"\". Releia o resumo com calma e tente de novo. Você consegue! 💪";
  // mensagem exibida quando a IA falha ou estoura o tempo (timeout)
  const falha = `Ops! Não consegui gerar a explicação agora. A resposta correta é "${respCorreta}". Continue praticando! 💪`;

  const myLesson=State.lesson, myIdx=Sess.idx;
  const aindaValido=()=> State.tela==="exercise" && Sess && State.lesson===myLesson && Sess.idx===myIdx && !Sess.acertouAtual;

  // 1) explicação já salva no Firestore (gerada antes, por qualquer dispositivo) → usa direto
  if(l.explicacoes && exId && l.explicacoes[exId]){
    if(aindaValido()) mostrarExplicacao(l.explicacoes[exId], respCorreta);
    return;
  }
  // 2) sem chave neste aparelho → mensagem padrão acolhedora
  if(!iaConfigurada()){ if(aindaValido()) mostrarExplicacao(padrao, respCorreta); return; }

  const pub = descreverPublico(ALUNO);
  const prompt =
`Você é um professor gentil e encorajador do ${pub.ano} do ${pub.nivel}.
Um aluno de aproximadamente ${pub.idade} anos errou a seguinte questão:
Enunciado: ${ex.enunciado}
Resposta do aluno: ${Sess.respAluno||"(em branco)"}
Resposta correta: ${respCorreta}
Conteúdo da lição: ${l.texto}

Gere uma explicação curta e acolhedora que:
- Comece dizendo que tudo bem errar, faz parte do aprendizado
- Explique de forma simples por que a resposta correta é a certa
- Use um exemplo do cotidiano para ilustrar
- Termine com uma frase de incentivo
- Tenha no máximo 100 palavras
${pub.frase}`;
  explicacaoEmAndamento = true;
  try{
    const txt = await chamarIA(prompt, IA_EXPLIC_TIMEOUT);
    const final = (txt && txt.trim()) || padrao;
    // persiste a explicação no Firestore (compartilha com os outros dispositivos)
    if(txt && txt.trim() && exId){
      l.explicacoes = l.explicacoes || {};
      l.explicacoes[exId] = final;
      const upd={}; upd["explicacoes."+exId]=final;
      try{ db.collection("licoes").doc(myLesson).update(upd); }catch(_){}
    }
    if(aindaValido()) mostrarExplicacao(final, respCorreta);
  }catch(e){
    // erro de rede, 401/429 ou timeout → sempre mostra a tela de explicação (com o botão)
    if(aindaValido()) mostrarExplicacao(falha, respCorreta);
  }finally{
    explicacaoEmAndamento = false;
  }
}

function mostrarExplicacao(texto, respCorreta){

  State.tela = "explain";

// Pré-gera (em segundo plano) a explicação de TODAS as questões que ainda não têm uma
// salva, e grava no Firestore. Assim qualquer dispositivo — inclusive sem a chave —
// já encontra a explicação pronta ao errar. Só roda em aparelho com a chave configurada.
let pregerando = false;
async function pregerarExplicacoes(l){
  if(DEMO) return; // demo: não pré-grava explicações no Firestore
  if(pregerando || !l || !iaConfigurada()) return;
  l.explicacoes = l.explicacoes || {};
  const faltando = (l.exercicios||[]).filter(ex=> ex.id && !l.explicacoes[ex.id]);
  if(!faltando.length) return;
  pregerando = true;
  const pub = descreverPublicoLicao(l);
  try{
    for(const ex of faltando){
      const respCorreta = ex.tipo==="fill" ? (ex.resposta||"") : (ex.opcoes? ex.opcoes[ex.correta] : "");
      const prompt =
`Você é um professor gentil e encorajador do ${pub.ano} do ${nomeNivel(pub.nivelId)}.
Um aluno de aproximadamente ${pub.idade} anos pode errar a seguinte questão:
Enunciado: ${ex.enunciado}
Resposta correta: ${respCorreta}
Conteúdo da lição: ${l.texto}

Gere uma explicação curta e acolhedora que:
- Comece dizendo que tudo bem errar, faz parte do aprendizado
- Explique de forma simples por que a resposta correta é a certa
- Use um exemplo do cotidiano para ilustrar
- Termine com uma frase de incentivo
- Tenha no máximo 100 palavras
${pub.frase}`;
      try{
        const txt = await chamarIA(prompt, 12000);
        const final = (txt||"").trim();
        if(final){
          l.explicacoes[ex.id] = final;
          const upd={}; upd["explicacoes."+ex.id]=final;
          try{ await db.collection("licoes").doc(l.id).update(upd); }catch(_){}
        }
      }catch(e){ /* segue para a próxima questão */ }
    }
  } finally { pregerando = false; }
}

// Grava o desempenho do aluno na lição (doc {alunoId}_{licaoId}) para o painel do professor.
async function salvarProgresso(subjId, lessonId, sess, modo){
  if(!db || !ALUNO || !ALUNO.id || !lessonId){ console.warn('salvarProgresso: sem db/aluno/lição — progresso não gravado.'); return; }
  const total = sess.total||0;
  const percentualAcertos = total>0 ? Math.round(sess.acertos/total*100) : 0;
  try{
    await db.collection("progresso").doc(ALUNO.id+"_"+lessonId).set({
      alunoId: ALUNO.id, alunoNome: ALUNO.nome, licaoId: lessonId, disciplina: subjId,
      turma: ALUNO.turma, ano: ALUNO.ano, nivel: ALUNO.nivel,
      acertos: sess.acertos, erros: sess.erros, xpGanho: sess.xpGanho, total: total,
      percentualAcertos: percentualAcertos, modo: modo||"classico",
      concluido: true, concluidoEm: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge:true });
    console.log('Progresso salvo:', ALUNO.id+"_"+lessonId, '→', sess.acertos+'/'+total, '('+percentualAcertos+'%)');
  }catch(e){ console.warn('Falha ao salvar progresso no Firestore:', e); }
}

function launchConfetti(){
  const host=document.getElementById("celebrate"); if(!host) return;
  const cores=["#58cc02","#1cb0f6","#ffc800","#ff4b4b","#ff7eb9","#9b59b6"];
  for(let i=0;i<70;i++){
    const c=document.createElement("div"); c.className="confetti";
    c.style.left=(Math.random()*100)+"%";
    c.style.background=cores[i%cores.length];
    c.style.animationDuration=(2+Math.random()*2)+"s";
    c.style.animationDelay=(Math.random()*0.6)+"s";
    c.style.borderRadius = Math.random()>.5?"50%":"2px";
    host.appendChild(c);
    setTimeout(()=>c.remove(),4500);
  }
}

async function prepararHistoria(){
  const l=getLesson();
  if(!l || !l.exercicios || !l.exercicios.length){ toast("Esta lição ainda não tem exercícios."); return; }
  const lid=l.id;
  State.tela="historiaLoading"; State._histLoadMsg=0; render(); iniciarRotacaoHistLoad();
  const ativo=()=> State.tela==="historiaLoading" && State.lesson===lid;
  // 1) memória
  if(historiaCache[lid]){ State._historia=historiaCache[lid]; iniciarHistoriaComStory(); return; }
  // 2) Firestore
  const cache = await getHistoriaGerada(lid);
  if(cache && Array.isArray(cache.capitulos) && cache.capitulos.length){
    historiaCache[lid]=cache; if(ativo()){ State._historia=cache; iniciarHistoriaComStory(); } return;
  }
  // 3) sem IA neste aparelho → não dá para gerar → cai no clássico
  if(!iaConfigurada()){ toast("Modo História indisponível (IA não configurada). Vamos no Modo Clássico! 📝"); iniciarModoClassico(); return; }
  // 4) gera pela IA (timeout de 60s dentro de gerarHistoriaIA); se falhar, oferece
  //    "Tentar novamente" ou "Usar Modo Clássico" numa tela de erro (não decide sozinho).
  try{
    const h = await gerarHistoriaIA(l);
    historiaCache[lid]=h; salvarHistoriaGerada(lid, h);
    if(ativo()){ State._historia=h; iniciarHistoriaComStory(); }
  }catch(e){
    console.warn("Falha ao gerar história:", e);
    if(ativo()){ clearInterval(histLoadTimer); State.tela="historiaErro"; render(); }
  }
}

// ----- Geração da história pela IA -----
async function gerarHistoriaIA(l){
  const pub = ALUNO ? descreverPublico(ALUNO)
    : (function(){ const p=descreverPublicoLicao(l); return { ano:p.ano, nivel:nomeNivel(p.nivelId), idade:p.idade, frase:p.frase }; })();
  const nQ = l.exercicios.length;
  // Geração em duas etapas: aqui geramos APENAS a narrativa (cenário + capítulos).
  // Os exercícios já existentes da lição são combinados depois (normalizarHistoria →
  // questao_index aponta para l.exercicios[i]), então NÃO pedimos exercícios à IA.
  // Passamos só os temas curtos das questões como contexto para a narrativa engatar.
  const temas = l.exercicios.map((ex,i)=>`${i}. ${String(ex.enunciado||"").slice(0,90)}`).join("\n");
  const prompt =
`Você é um escritor criativo e professor do ${pub.ano} do ${pub.nivel}.
Crie a narrativa de uma história interativa curta (aventura, mistério ou fantasia) para
uma criança de ${pub.idade} anos, com EXATAMENTE ${nQ} capítulos (um por desafio).
NÃO crie exercícios ou perguntas — apenas a narrativa. Cada capítulo é uma cena curta
que leva a um desafio; o desafio educacional será encaixado depois.

Regras:
- Protagonista com nome divertido que a criança controla.
- Cenário adequado à faixa etária (floresta mágica, espaço, fundo do mar, castelo, cidade futurista...).
- Se acertar: a história avança positivamente. Se errar: um contratempo leve, sem punição severa.
- IMPORTANTE: cada narrativa (intro/acerto/erro) deve ter NO MÁXIMO 100 palavras. Seja conciso.

Temas dos ${nQ} desafios (use como inspiração da cena, na mesma ordem):
${temas}

Retorne APENAS um JSON compacto, sem quebras de linha desnecessárias:
{
"titulo":"...",
"cenario":"cenário em 1-2 frases",
"protagonista":"nome",
"capitulos":[{"narrativa_intro":"cena que leva ao desafio (2-3 frases)","narrativa_acerto":"se acertar (1-2 frases)","narrativa_erro":"se errar (1-2 frases)"}],
"desfecho_heroi":"final épico se acertar +70% (2-3 frases)",
"desfecho_aprendiz":"final encorajador se acertar -70% (2-3 frases)"
}`;
  const txt = await chamarIA(prompt, 60000);
  const h = parseHistoriaIA(txt);
  if(!h || !Array.isArray(h.capitulos) || !h.capitulos.length) throw new Error("A IA não retornou uma história válida.");
  // Garante a ligação capítulo→questão pela ordem (a IA não precisa mais mandar questao_index).
  h.capitulos.forEach((c,i)=>{ if(c && typeof c.questao_index!=="number") c.questao_index=i; });
  return h;
}
function parseHistoriaIA(texto){
  if(!texto) return null;
  let s=String(texto).trim().replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");
  const ini=s.indexOf("{"), fim=s.lastIndexOf("}");
  if(ini>=0 && fim>ini) s=s.slice(ini,fim+1);
  const o=jsonParseTolerante(s); return (o===undefined)?null:o;
}
// Garante título/cenário/protagonista e exatamente nQ capítulos (preenche/apara).
function normalizarHistoria(h, nQ){
  h = h || {};
  let caps = Array.isArray(h.capitulos) ? h.capitulos.slice(0, nQ) : [];
  while(caps.length < nQ){
    caps.push({ narrativa_intro:"O desafio continua! Resolva a próxima questão para seguir em frente.",
      questao_index:caps.length, narrativa_acerto:"Você superou mais um obstáculo!", narrativa_erro:"Um tropeço, mas a jornada continua!" });
  }
  return {
    titulo: h.titulo || "Uma Grande Aventura",
    cenario: h.cenario || "Uma floresta mágica cheia de surpresas.",
    protagonista: h.protagonista || "Herói(na)",
    capitulos: caps,
    desfecho_heroi: h.desfecho_heroi || "Você venceu todos os desafios como um verdadeiro herói! Sua coragem e inteligência salvaram o dia. Parabéns, campeão(ã)!",
    desfecho_aprendiz: h.desfecho_aprendiz || "Que jornada incrível! Você enfrentou cada desafio com bravura e aprendeu muito pelo caminho. Continue praticando, grande aprendiz — a próxima aventura será ainda melhor!"
  };
}

const CENARIOS = {
  floresta: { grad:"linear-gradient(160deg,#a8e063,#3a8f3a)", emojis:"🌲🍄🦊🌿🦉" },
  espaco:   { grad:"linear-gradient(160deg,#2b2f77,#0b0b2b)", emojis:"🚀🪐⭐🌙👽" },
  mar:      { grad:"linear-gradient(160deg,#48c6ef,#1565c0)", emojis:"🐠🐙🌊🐚🐢" },
  castelo:  { grad:"linear-gradient(160deg,#b993d6,#8ca6db)", emojis:"🏰🐉⚔️👑🛡️" },
  cidade:   { grad:"linear-gradient(160deg,#7f7fd5,#2b5876)", emojis:"🏙️🤖🚦✨🛸" },
  deserto:  { grad:"linear-gradient(160deg,#f6d365,#d9954b)", emojis:"🏜️🐪🌵☀️🔺" },
};
function detectarCenario(txt){
  const t=norm(txt);
  if(/espac|galax|planeta|estrela|foguete|nave|astronaut|cosmo|lua/.test(t)) return "espaco";
  if(/mar|ocean|submar|agua|peixe|sereia|coral|praia/.test(t)) return "mar";
  if(/castel|medieval|reino|\brei\b|rainha|cavaleir|dragao|princes/.test(t)) return "castelo";
  if(/cidade|futur|robo|tecnolog|neon|arranha/.test(t)) return "cidade";
  if(/desert|piramid|egito|areia|farao|faraó|oasis/.test(t)) return "deserto";
  if(/florest|selva|bosque|arvore|árvore|magic|mágic|jardim/.test(t)) return "floresta";
  return "floresta";
}
function cenarioArte(cenario){
  const c = CENARIOS[detectarCenario(cenario)] || CENARIOS.floresta;
  return `<div class="hist-cena" style="background:${c.grad}">
    <div class="hist-cena-emojis">${c.emojis}</div>
  </div>`;
}

function responderHistoria(ok, ex, xpQ){
  const cap = capituloAtual();
  const myIdx=Sess.idx, myLesson=State.lesson;
  if(ok){
    Sess.acertos++; Sess.xpGanho += xpQ; Sound.correct();
    Sess.feedback = { ok:true, texto: cap.narrativa_acerto || "Você superou o desafio!" };
    renderHistoria();
    Fala.ler("Incrível! "+(cap.narrativa_acerto||""), true);
    setTimeout(()=>{ if(State.tela==="historia" && Sess && Sess.modo==="historia" && State.lesson===myLesson && Sess.idx===myIdx) avancarHistoria(); }, 2200);
  } else {
    Sess.erros++; Sess.vidas--; Sound.wrong();
    Sess.feedback = { ok:false, texto: cap.narrativa_erro || "Um contratempo na jornada...", explic:null };
    renderHistoria();
    const wrap=document.getElementById("optWrap"); if(wrap) wrap.classList.add("shake");
    Fala._protegerUmaVez=true; Fala.ler("Ops! "+(cap.narrativa_erro||""));
    gerarExplicacaoTexto(ex).then(txt=>{

        Sess.feedback.explic = txt || "Revise o resumo e tente na próxima!";
        if(State.tela==="historia") renderHistoria();
      }
    });
  }
}
// Explicação do erro como TEXTO (reusa o cache/persistência de "explicacoes"); não troca de tela.
async function gerarExplicacaoTexto(ex){
  const l=getLesson();
  const respCorreta = ex.tipo==="fill" ? (ex.resposta||"") : (ex.opcoes? ex.opcoes[ex.correta] : "");
  const padrao = `A resposta certa é "${respCorreta}". Releia o resumo com calma — você consegue! 💪`;
  if(l && l.explicacoes && ex.id && l.explicacoes[ex.id]) return l.explicacoes[ex.id];
  if(!iaConfigurada()) return padrao;
  const pub = descreverPublico(ALUNO);
  const prompt =
`Você é um professor gentil e encorajador do ${pub.ano} do ${pub.nivel}.
Um aluno de aproximadamente ${pub.idade} anos errou a seguinte questão:
Enunciado: ${ex.enunciado}
Resposta correta: ${respCorreta}
Conteúdo da lição: ${l?l.texto:""}
Explique em no máximo 60 palavras, de forma simples e acolhedora, por que a resposta certa é a correta. ${pub.frase}`;
  try{
    const txt = await chamarIA(prompt, IA_EXPLIC_TIMEOUT);
    const final = (txt && txt.trim()) || padrao;
    if(txt && txt.trim() && ex.id && l){
      l.explicacoes = l.explicacoes||{}; l.explicacoes[ex.id]=final;
      const upd={}; upd["explicacoes."+ex.id]=final;
      try{ db.collection("licoes").doc(l.id).update(upd); }catch(_){}
    }
    return final;
  }catch(e){ return padrao; }
}

   D3) LIÇÃO DE INTERPRETAÇÃO DE TEXTO (fluxo do aluno)
