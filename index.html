// Divide o texto gerado em parágrafos (para leitura/destaque).
function paragrafosTexto(txt){ return String(txt||"").split(/\n+/).map(p=>p.trim()).filter(Boolean); }

// Leitor de texto por parágrafo com destaque, controles e pausa de 0.5s entre trechos.
// Genérico: funciona no resumo de estudo E no texto de interpretação (ctx define a tela,
// as classes/ids dos parágrafos, a cor de destaque e o handler de "Ouvir").
const LeitorTexto = {
  paras:[], idx:0, ativo:false, pausado:false, _timer:null, _introTxt:"",
  ctx:{ tela:"interpRead", parIdPrefix:"ipar-", parClass:"interp-par", cor:"#1cb0f6", iniciarHandler:"ouvirTextoInterp", rotulo:"Ouvir o texto" },
  configurar(ctx){ if(ctx) this.ctx=Object.assign({}, this.ctx, ctx); },
  iniciar(paras, ctx){
    this.parar(); this.configurar(ctx);
    if(!Fala.ok() || !paras.length) return;
    this.paras=paras; this.ativo=true; this.pausado=false;
    // intro do estilo (ex.: Podcast "Vamos aprender sobre {titulo}") antes do 1º parágrafo
    this._introTxt = textoEstiloComTitulo(estiloAtual().intro||"");
    this.idx = this._introTxt ? -1 : 0;
    atualizarControlesLeitor(); this._falar();
  },
  _falar(){
    if(!this.ativo || State.tela!==this.ctx.tela) { this.ativo=false; return; }
    // parágrafo -1 = introdução falada do estilo (sem destaque)
    if(this.idx===-1){
      destacarParagrafo(-1);
      const txt=this._introTxt; this._introTxt="";
      if(!txt){ this.idx=0; return this._falar(); }
      try{
        const u=new SpeechSynthesisUtterance(processarEstiloTexto(txt).slice(0,4000));
        aplicarEstiloVoz(u);
        const seguir=()=>{ if(!this.ativo) return; this.idx=0; this._timer=setTimeout(()=>this._falar(), 300); };
        u.onend=seguir; u.onerror=seguir; window.speechSynthesis.speak(u);
      }catch(e){ this.idx=0; this._timer=setTimeout(()=>this._falar(), 300); }
      return;
    }
    if(this.idx>=this.paras.length){ this.ativo=false; this.pausado=false; destacarParagrafo(-1); atualizarControlesLeitor(); return; }
    destacarParagrafo(this.idx);
    try{
      const u=new SpeechSynthesisUtterance(processarEstiloTexto(this.paras[this.idx]).slice(0,4000));
      aplicarEstiloVoz(u);
      const pausa=pausaParaEstilo(); // audiolivro = 1s entre parágrafos; demais = 0.5s
      const seguir=()=>{ if(!this.ativo) return; this.idx++; this._timer=setTimeout(()=>this._falar(), pausa); };
      u.onend=seguir; u.onerror=seguir;
      window.speechSynthesis.speak(u);
    }catch(e){ this.idx++; this._timer=setTimeout(()=>this._falar(), 500); }
  },
  pausar(){ if(this.ativo && !this.pausado){ try{window.speechSynthesis.pause();}catch(e){} this.pausado=true; atualizarControlesLeitor(); } },
  retomar(){ if(this.ativo && this.pausado){ try{window.speechSynthesis.resume();}catch(e){} this.pausado=false; atualizarControlesLeitor(); } },
  parar(){ this.ativo=false; this.pausado=false; clearTimeout(this._timer); try{ if(Fala.ok()) window.speechSynthesis.cancel(); }catch(e){} destacarParagrafo(-1); atualizarControlesLeitor(); }
};
// Destaca o parágrafo i (cor da disciplina 20% + borda esquerda) e faz scroll até ele.
function destacarParagrafo(i){
  const ctx=LeitorTexto.ctx||{}; const cor=ctx.cor||"#1cb0f6";
  try{
    document.querySelectorAll("."+(ctx.parClass||"interp-par")).forEach((el,j)=>{
      const on=(j===i); el.classList.toggle("lendo", on);
      if(on){ el.style.background=cor+"33"; el.style.borderLeftColor=cor; }
      else { el.style.background=""; el.style.borderLeftColor=""; }
    });
    if(i>=0){ const el=document.getElementById((ctx.parIdPrefix||"ipar-")+i); if(el && el.scrollIntoView) el.scrollIntoView({block:"center", behavior:"smooth"}); }
  }catch(e){}
  atualizarProgressoLeitor();
}
// Indicador "Lendo parágrafo X de N..."
function atualizarProgressoLeitor(){
  const el=document.getElementById("leitorProgTxt"); if(!el) return;
  const L=LeitorTexto;
  if(!L.ativo){ el.textContent=""; return; }

// Destaca (best-effort) as palavras do parágrafo que aparecem no enunciado da questão atual.
// Token a token (cada token é escapado individualmente) — sem manipular HTML já montado.
function destacarTrechoRelevante(paragrafo, ex){
  if(!ex || !ex.enunciado) return esc(paragrafo);
  const kws = new Set(String(ex.enunciado).split(/\s+/).map(w=>norm(w.replace(/[^\wÀ-ÿ]/g,""))).filter(w=>w.length>4));
  if(!kws.size) return esc(paragrafo);
  const chaves = Array.from(kws);
  return String(paragrafo).split(/(\s+)/).map(tok=>{
    if(/^\s*$/.test(tok)) return esc(tok);
    const limpo = norm(tok.replace(/[^\wÀ-ÿ]/g,""));
    const hit = limpo.length>3 && chaves.some(k=> limpo===k || limpo.indexOf(k)>=0 || k.indexOf(limpo)>=0);
    return hit ? `<mark class="interp-mark">${esc(tok)}</mark>` : esc(tok);
  }).join("");
}
function fatoCuriosoGenero(g){
  const k=norm(g||"");
  if(k.indexOf("fabula")>=0||k.indexOf("fábula")>=0) return "As fábulas são histórias antigas com animais que falam e sempre terminam com uma lição de moral. Muitas vêm de Esopo, há mais de 2.500 anos!";
  if(k.indexOf("poema")>=0) return "Os poemas brincam com o som das palavras: rimas, ritmo e versos deixam a leitura musical!";
  if(k.indexOf("noticia")>=0||k.indexOf("notícia")>=0) return "Uma notícia responde às perguntas: o quê, quem, quando, onde e por quê. Assim contamos um fato de verdade!";
  if(k.indexOf("carta")>=0) return "Antes da internet, as cartas viajavam dias pelo correio para levar recados e carinho de longe!";
  if(k.indexOf("tirinha")>=0) return "As tirinhas contam histórias em poucos quadrinhos e quase sempre terminam com uma piada ou surpresa!";
  if(k.indexOf("receita")>=0) return "Uma receita é um texto que dá instruções em ordem — igual a um mapa para chegar a um prato delicioso!";
  if(k.indexOf("conto")>=0) return "O conto é uma história curta com começo, meio e fim, e costuma ter poucos personagens bem marcantes!";
  return "Cada gênero textual tem um jeito próprio de contar as coisas — quanto mais você lê, mais esperto(a) fica na leitura!";
}

    u.rate=Math.min(2,Math.max(0.3,(est.rate||1)*(cfg.vel||1))); u.pitch=est.pitch||1; u.volume=(typeof est.volume==="number"?est.volume:1);

function teacherTab(t){
  if(t!=="novo") Teacher.editingLesson=null;
  Teacher.tab=t;
  if(t==="progresso" && !Teacher.prog.carregada && !Teacher.prog.carregando){ carregarRendimento(); return; }
  if(t==="premios" && !Teacher.prem.carregada && !Teacher.prem.carregando){ carregarPremiacoesProf(); return; }
  if(t==="corretor"){ // carrega alunos e histórico de correções ao abrir
    Teacher.corretor.subj = Teacher.corretor.subj || Teacher.subj || "mat";
    carregarAlunosCorretor(); carregarHistoricoCorrecoes();
  }
  if(t==="conta"){ // carrega os valores atuais da conta para edição
    Teacher.conta.turmas = (PROFESSOR && Array.isArray(PROFESSOR.turmas)) ? PROFESSOR.turmas.slice() : [];
    Teacher.conta.anos   = (PROFESSOR && Array.isArray(PROFESSOR.anos)) ? PROFESSOR.anos.slice() : [];
    Teacher.conta.disc   = (PROFESSOR && Array.isArray(PROFESSOR.disciplinas)) ? PROFESSOR.disciplinas.slice() : [];
    Teacher.conta.salvando=false;
  }
  render();
}

    list = `<div class="empty"><div class="em">📝</div><p>Nenhuma lição desta disciplina para as suas turmas/anos.<br>Crie uma na aba "Nova".</p></div>`;

function subjSelect(val, onchange){
  return `<select onchange="${onchange}">${SUBJECTS.map(s=>`<option value="${s.id}" ${s.id===val?'selected':''}>${s.icon} ${esc(s.nome)}</option>`).join("")}</select>`;

// Rótulo do escopo de uma lição (nível/ano/turma) para o professor.
function escopoLicaoLabel(l){
  const parts=[];
  if(l.nivel) parts.push(nomeNivel(l.nivel));
  if(l.ano) parts.push(l.ano);
  parts.push(l.turma ? ("Turma "+l.turma) : "Todas as turmas");
  return parts.join(" • ");
}

function resetIaEstado(){ Teacher.gerando=false; Teacher.regenerando=false; Teacher.previewing=false; Teacher.iaErro=""; Teacher.iaConfigAberta=false; }
function newLesson(){ Teacher.editingLesson={ id:null, titulo:"", texto:"", exercicios:[], turma:"", nivel:"", ano:"", materialNomes:[], materialTipos:[], materialTexto:"", historiaHabilitada:true, tipo:"padrao", textoGerado:"", tituloTexto:"", generoTextual:"", tema:"", _tamanho:"", _focos:[], _persistido:false }; resetIaEstado(); Teacher.upload={ ativo:false, nome:"", lendo:false }; Teacher.hist={ gerando:false, preview:null, erro:"" }; Teacher.interp={ gerando:false, erro:"" }; Teacher.tab="novo"; render(); }
function editLesson(id){
  const l=(DATA[Teacher.subj]||[]).find(x=>x.id===id);
  if(!l) return;
  // clone profundo para edição
  Teacher.editingLesson = JSON.parse(JSON.stringify(l));
  Teacher.editingLesson._persistido = true; // já existe no Firestore
  // garante os campos em lições antigas (compatibilidade)
  const L=Teacher.editingLesson;
  L.materialNomes=L.materialNomes||[]; L.materialTipos=L.materialTipos||[]; L.materialTexto=L.materialTexto||"";
  if(L.historiaHabilitada===undefined) L.historiaHabilitada=true;
  if(!L.tipo) L.tipo="padrao"; if(!Array.isArray(L._focos)) L._focos=[]; if(L._tamanho===undefined) L._tamanho="";
  resetIaEstado(); Teacher.upload={ ativo:false, nome:"", lendo:false }; Teacher.hist={ gerando:false, preview:null, erro:"" }; Teacher.interp={ gerando:false, erro:"" };
  // carrega a história já gerada (se houver) para mostrar o indicador/preview
  if(id) getHistoriaGerada(id).then(h=>{ if(h && Teacher.editingLesson && Teacher.editingLesson.id===id){ Teacher.hist.preview=h; if(Teacher.tab==="novo") render(); } });
  Teacher.tab="novo"; render();
}
async function deleteLesson(id){
  if(!confirm("Excluir esta lição e todos os seus exercícios?")) return;
  if(DEMO){ removeLicaoLocal(id); toast("Lição removida (modo demo)."); render(); return; }
  toast("Excluindo...");
  try{
    await db.collection("licoes").doc(id).delete();
    removeLicaoLocal(id);
    toast("Lição excluída.");
    render();
  }catch(e){
    toast("Erro ao excluir. Verifique a conexão.");
  }
}

const INTERP_TAMANHOS = [
  { v:"curto", l:"Curto (150-200 palavras) — 1º ao 3º ano", palavras:"150 a 200" },

  clearInterval(interpLoadTimer); let i=0;

function interpConfigPanel(L){
  const I=Teacher.interp||{}; const temChave=iaConfigurada();

  const ini=s.indexOf("{"), fim=s.lastIndexOf("}");

  const o=jsonParseTolerante(s); return (o===undefined)?null:o;

/* ---- MATERIAL DE APOIO: extração LOCAL de texto (sem Firebase Storage) ----
   O professor importa documentos e o texto é extraído no próprio navegador:
   TXT via FileReader, PDF via PDF.js, DOC/DOCX via mammoth.js e imagens (PNG/JPG)
   via visão da OpenAI (base64). NÃO há upload: só o texto (limitado a
   MATERIAL_TEXTO_MAX caracteres) é salvo na lição e usado para gerar exercícios/resumo. */
const MATERIAL_MAX_BYTES = 10*1024*1024;      // 10 MB por arquivo
const MATERIAL_MAX_ARQUIVOS = 3;              // no máximo 3 documentos por lição
const MATERIAL_TEXTO_MAX = 8000;              // teto do texto extraído enviado à IA
const MATERIAL_EXT_OK = ["pdf","doc","docx","txt","png","jpg","jpeg"];

function materialExt(nome){ const m=String(nome||"").toLowerCase().match(/\.([a-z0-9]+)$/); return m?m[1]:""; }
function materialTipoOk(file){
  const ext = materialExt(file.name);
  if(MATERIAL_EXT_OK.indexOf(ext)>=0) return true;
  const t=(file.type||"").toLowerCase();
  return /pdf|msword|wordprocessingml|text\/plain|image\/(png|jpeg)/.test(t);
}
function materialEhImagem(tipo, nome){ return (/^image\//.test(tipo||"")) || /\.(png|jpe?g)$/i.test(nome||""); }
function materialIcone(tipo, nome){
  const ext=materialExt(nome);
  if(materialEhImagem(tipo,nome)) return "🖼️";
  if(ext==="pdf") return "📕";
  if(ext==="doc"||ext==="docx") return "📘";
  if(ext==="txt") return "📄";
  return "📎";
}

// leitores de arquivo (Promise)
function lerComoTexto(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result||"")); r.onerror=()=>rej(r.error||new Error("read")); r.readAsText(file); }); }
function lerComoDataURL(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result||"")); r.onerror=()=>rej(r.error||new Error("read")); r.readAsDataURL(file); }); }
function lerComoBuffer(file){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error||new Error("read")); r.readAsArrayBuffer(file); }); }

async function extrairTextoPdf(file){
  if(typeof pdfjsLib==="undefined") throw new Error("PDF.js não carregou.");
  const buf = await lerComoBuffer(file);
  const pdf = await pdfjsLib.getDocument({ data:buf }).promise;
  let txt="";
  for(let p=1; p<=pdf.numPages; p++){
    const page = await pdf.getPage(p);
    const content = await page.getTextContent();
    txt += content.items.map(it=>it.str).join(" ") + "\n";
    if(txt.length>=MATERIAL_TEXTO_MAX) break; // já temos o suficiente
  }
  return txt;
}
async function extrairTextoDocx(file){
  if(typeof mammoth==="undefined") throw new Error("mammoth.js não carregou.");
  const buf = await lerComoBuffer(file);
  const r = await mammoth.extractRawText({ arrayBuffer:buf });
  return (r && r.value) || "";
}
// Extrai texto de UM arquivo conforme o tipo. Imagens usam visão da OpenAI (OCR).
async function extrairTextoArquivo(file){
  const ext = materialExt(file.name), tipo=(file.type||"").toLowerCase();
  try{
    if(ext==="txt" || tipo==="text/plain") return await lerComoTexto(file);
    if(ext==="pdf" || tipo==="application/pdf") return await extrairTextoPdf(file);
    if(ext==="docx" || tipo.indexOf("wordprocessingml")>=0) return await extrairTextoDocx(file);
    if(ext==="doc" || tipo==="application/msword"){
      toast("Arquivos .doc antigos não permitem extração de texto — será usado apenas como referência.");
      return "";
    }
    if(materialEhImagem(tipo, file.name)){
      if(!iaConfigurada()) return ""; // sem chave: imagem fica só como anexo visual
      const dataUrl = await lerComoDataURL(file);
      return await ocrImagemIA(dataUrl);
    }
  }catch(e){ console.warn("Falha ao extrair texto de", file.name, e); }
  return "";
}

// Envia o material para o Storage com barra de progresso; resolve com a URL de download.
// Recompõe o texto combinado dos documentos (cabeçalho [nome] + texto), limitado a MATERIAL_TEXTO_MAX.
// Remove do texto combinado o bloco do documento de índice `idx` (usado ao remover um anexo).
function removerBlocoMaterial(combinado, nomes, idx){
  const marca = `[${nomes[idx]||""}]\n`;
  const start = (combinado||"").indexOf(marca);
  if(start<0) return combinado||""; // bloco não localizado — mantém o texto como está
  let end = combinado.length;
  for(let j=0;j<nomes.length;j++){
    if(j===idx) continue;
    const m2 = combinado.indexOf(`[${nomes[j]||""}]\n`, start+marca.length);
    if(m2>=0 && m2<end) end = m2;
  }
  return (combinado.slice(0,start) + combinado.slice(end)).replace(/\n{3,}/g,"\n\n").replace(/^\s+|\s+$/g,"");
}

// Handler do seletor de arquivos: valida e EXTRAI O TEXTO LOCALMENTE (sem upload).
// TXT→FileReader, PDF→PDF.js, DOC/DOCX→mammoth, imagens (PNG/JPG)→visão da OpenAI (base64).
async function onSelecionarMateriais(fileList){
  syncTextInputs();
  const L = Teacher.editingLesson;
  const arquivos = Array.prototype.slice.call(fileList||[]);
  if(!arquivos.length) return;
  L.materialNomes=L.materialNomes||[]; L.materialTipos=L.materialTipos||[]; L.materialTexto=L.materialTexto||"";
  if(L.materialNomes.length + arquivos.length > MATERIAL_MAX_ARQUIVOS){
    toast(`Máximo de ${MATERIAL_MAX_ARQUIVOS} documentos por lição.`); return;
  }
  // valida tamanho e tipo ANTES de ler
  for(const f of arquivos){
    if(f.size > MATERIAL_MAX_BYTES){ toast(`"${f.name}" tem mais de 10MB. Escolha um arquivo menor.`); return; }
    if(!materialTipoOk(f)){ toast(`Formato não suportado: "${f.name}". Use PDF, DOC, DOCX, TXT, PNG ou JPG.`); return; }
  }
  let textoAcumulado = L.materialTexto || "";
  let algumErro=false, lidos=0;
  for(const f of arquivos){
    try{
      // loading "📄 Lendo documento..."
      Teacher.upload={ ativo:true, nome:f.name, lendo:true }; render();
      let txt = (await extrairTextoArquivo(f) || "").trim();
      if(!txt){
        // .doc antigo, PDF sem texto selecionável, ou imagem sem chave de IA configurada
        algumErro=true;
        toast(`Não foi possível extrair texto de "${f.name}". Tente um PDF/DOCX/TXT com texto selecionável.`);
        continue;
      }
      // acumula (com cabeçalho do arquivo), limitando o TOTAL a MATERIAL_TEXTO_MAX (primeiros 8000)
      if(textoAcumulado.length < MATERIAL_TEXTO_MAX){
        textoAcumulado += (textoAcumulado?"\n\n":"") + `[${f.name}]\n` + txt;
        if(textoAcumulado.length > MATERIAL_TEXTO_MAX) textoAcumulado = textoAcumulado.slice(0, MATERIAL_TEXTO_MAX);
      }
      L.materialNomes.push(f.name); L.materialTipos.push(f.type||"");
      lidos++;
    }catch(e){
      algumErro=true;
      console.warn("Falha ao ler material", f.name, e);
      toast(`Erro ao ler "${f.name}". Verifique o arquivo e tente novamente.`);
    }
  }
  L.materialTexto = textoAcumulado; // guardado apenas no estado local; vai ao Firestore só ao Salvar
  Teacher.upload={ ativo:false, nome:"", lendo:false };
  render();
  if(lidos && !algumErro){
    toast(`✅ Documento lido com sucesso! ${textoAcumulado.length} caracteres extraídos.`);
  }
}

// Remove um documento importado: tira do estado local (nome/tipo) e recompõe o texto combinado.
// A alteração só chega ao Firestore quando o professor Salvar a lição.
function removerMaterial(i){
  const L=Teacher.editingLesson;
  if(!L || !Array.isArray(L.materialNomes) || i<0 || i>=L.materialNomes.length) return;
  const nome=L.materialNomes[i]||"este documento";
  if(!confirm(`Remover "${nome}" do material de apoio?`)) return;
  L.materialTexto = removerBlocoMaterial(L.materialTexto||"", L.materialNomes, i);
  L.materialNomes.splice(i,1); L.materialTipos.splice(i,1);
  render();
  toast("Documento removido.");
}

// Chamada genérica à IA. Usa o proxy se configurado (sem chave no cliente);
// senão chama a OpenAI direto com a chave. timeoutMs aborta e lança Error("timeout").
async function chamarIA(prompt, timeoutMs){
  return chamarIAMensagens([{ role:"user", content: prompt }], timeoutMs);
}
// Extrai texto educacional de uma imagem via visão da OpenAI (OCR). dataUrl = "data:image/...;base64,..."
async function ocrImagemIA(dataUrl){
  return chamarIAMensagens([{ role:"user", content:[
    { type:"image_url", image_url:{ url:dataUrl } },
    { type:"text", text:"Extraia todo o texto educacional desta imagem. Responda apenas com o texto extraído, sem comentários." }
  ]}], 45000);
}
// Núcleo da chamada à IA: recebe o array `messages` (texto ou conteúdo multimodal p/ visão).
async function chamarIAMensagens(messages, timeoutMs){
  const usaProxy = !!(IA.proxyUrl && IA.proxyUrl.trim());
  if(!usaProxy && !IA.apiKey.trim()) throw new Error("Sem chave de API configurada.");
  const ctrl = (typeof AbortController!=="undefined") ? new AbortController() : null;
  let timer=null, expirou=false;
  if(ctrl && timeoutMs){ timer=setTimeout(()=>{ expirou=true; try{ ctrl.abort(); }catch(_){} }, timeoutMs); }
  const headers = { "Content-Type":"application/json" };
  if(!usaProxy) headers["Authorization"] = "Bearer " + IA.apiKey.trim(); // proxy injeta a chave
  let resp;
  try{
    resp = await fetch(usaProxy ? IA.proxyUrl.trim() : IA_ENDPOINT, {
      method:"POST",
      headers: headers,
      body: JSON.stringify({
        model: IA_MODELO,
        messages: messages,
        temperature: 0.7
      }),
      signal: ctrl ? ctrl.signal : undefined
    });
  }catch(e){
    if(expirou || (e && e.name==="AbortError")) throw new Error("timeout");
    throw e;
  }finally{
    if(timer) clearTimeout(timer);
  }
  if(!resp.ok){
    let detalhe="";
    try{ const e=await resp.json(); detalhe = e.error && e.error.message ? e.error.message : ""; }catch(_){}
    if(resp.status===401) detalhe = detalhe || "Chave da API inválida.";
    if(resp.status===429) detalhe = detalhe || "Limite de uso atingido. Aguarde um pouco e tente novamente.";
    throw new Error(`Erro ${resp.status}${detalhe? " — "+detalhe : ""}`);
  }
  const data = await resp.json();
  return data.choices && data.choices[0] && data.choices[0].message
    ? (data.choices[0].message.content || "") : "";
}

// Mensagem de erro amigável e precisa para falhas da IA (uso nos painéis do professor/admin).
// Obs.: a OpenAI NÃO envia CORS nas respostas de erro (401/429), então o navegador bloqueia
// e o fetch vira "Failed to fetch" — por isso chave inválida/sem créditos parece "erro de rede".
function mensagemErroIA(err){
  let msg = (err && err.message) ? err.message : "Falha ao contatar a IA.";
  if(msg==="timeout") return "A IA demorou demais para responder. Tente novamente.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(msg))
    return "Falha na chamada à OpenAI. Verifique, nesta ordem: (1) a chave é válida e a conta tem créditos/billing ativo; (2) a rede/firewall não bloqueia api.openai.com (redes corporativas costumam bloquear); (3) sua internet.";
  return msg;
}

// Escapa quebras de linha/controles CRUS dentro de strings JSON (a IA às vezes devolve
// texto multiparágrafo com \n literal, o que quebra o JSON.parse). Preserva a estrutura.
function sanitizarControlesJson(s){
  let out="", inStr=false, esc=false;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(esc){ out+=c; esc=false; continue; }
    if(c==='\\'){ out+=c; esc=true; continue; }
    if(c==='"'){ inStr=!inStr; out+=c; continue; }
    if(inStr){
      if(c==='\n'){ out+='\\n'; continue; }
      if(c==='\r'){ out+='\\r'; continue; }
      if(c==='\t'){ out+='\\t'; continue; }
    }
    out+=c;
  }
  return out;
}
// JSON.parse tolerante: tenta direto e, se falhar, com os controles escapados.
function jsonParseTolerante(s){
  try{ return JSON.parse(s); }catch(e){}
  try{ return JSON.parse(sanitizarControlesJson(s)); }catch(e){ return undefined; }
}
// Converte o JSON retornado pela IA para o formato interno de exercícios
function parseExerciciosIA(texto){
  if(!texto) return [];
  let s = texto.trim();
  // remove cercas de código ```json ... ```
  s = s.replace(/^```(?:json)?\s*/i,"").replace(/\s*```$/,"");
  // tenta extrair o array, caso venha com texto ao redor
  const ini=s.indexOf("["), fim=s.lastIndexOf("]");
  if(ini>=0 && fim>ini) s = s.slice(ini, fim+1);
  const arr = jsonParseTolerante(s);
  if(!Array.isArray(arr)) return [];

  const out=[];
  arr.forEach(item=>{
    if(!item || !item.enunciado) return;
    const tipo = String(item.tipo||"").toLowerCase();
    const resp = item.resposta_correta;
    const nivel = normalizarNivelDif(item.nivel);
    if(tipo.indexOf("verdadeiro")>=0 || tipo==="vf"){
      const v = norm(resp);
      out.push({ id:uid(), tipo:"vf", nivel, enunciado:String(item.enunciado),
        opcoes:["Verdadeiro","Falso"], correta:(v.charAt(0)==="v"||v==="true"||v==="1")?0:1 });
    } else if(tipo.indexOf("lacuna")>=0 || tipo.indexOf("completar")>=0 || tipo==="fill"){
      out.push({ id:uid(), tipo:"fill", nivel, enunciado:String(item.enunciado), resposta:String(resp==null?"":resp) });
    } else { // múltipla escolha (padrão)
      let opcoes = Array.isArray(item.opcoes)? item.opcoes.map(o=>String(o)) : [];
      if(opcoes.length<2) return;
      let correta = acharIndiceCorreto(opcoes, resp);
      out.push({ id:uid(), tipo:"mc", nivel, enunciado:String(item.enunciado), opcoes, correta });
    }
  });
  return out;
}
// Normaliza o nível de dificuldade vindo da IA (ignora acentos/variações).
function normalizarNivelDif(v){
  const n=norm(v);
  if(n.indexOf("facil")>=0) return "facil";
  if(n.indexOf("interm")>=0) return "intermediario";
  if(n.indexOf("dific")>=0) return "dificil";
  return "";
}
// Conta quantas questões há de cada dificuldade.
function contarPorDificuldade(arr){
  const c={ facil:0, intermediario:0, dificil:0 };
  (arr||[]).forEach(ex=>{ if(c[ex.nivel]!==undefined) c[ex.nivel]++; });
  return c;
}
// Descobre o índice da opção correta a partir de "resposta_correta" (texto da opção ou letra A/B/C/D)
function acharIndiceCorreto(opcoes, resp){
  if(resp==null) return 0;
  const r = String(resp).trim();
  // match exato por texto (ignora acentos/maiúsculas)
  let idx = opcoes.findIndex(o=>norm(o)===norm(r));
  if(idx>=0) return idx;
  // letra A-Z
  if(/^[a-zA-Z]$/.test(r)){
    const li = r.toUpperCase().charCodeAt(0)-65;
    if(li>=0 && li<opcoes.length) return li;
  }
  // contém o texto
  idx = opcoes.findIndex(o=>norm(o).indexOf(norm(r))>=0 && norm(r).length>0);
  return idx>=0 ? idx : 0;
}

// ---- mutações do exercício em edição (sincroniza inputs antes de re-render) ----
function syncTextInputs(){

    materialTexto: materialTexto,
    historiaHabilitada: historiaHabilitada

  if(DEMO){
    const idLocal = L.id || ("demo_novo_"+Math.random().toString(36).slice(2,8));
    removeLicaoLocal(idLocal);
    if(!DATA[disc]) DATA[disc]=[];
    DATA[disc].push({ id:idLocal, titulo:L.titulo, texto:conteudo, exercicios:L.exercicios, resumoIA:"", explicacoes:{}, turma:turmaN, ano:anoN, nivel:nivelN, materialNomes:materialNomes, materialTipos:materialTipos, materialTexto:materialTexto, historiaHabilitada:historiaHabilitada, tipo:tipo, textoGerado:payload.textoGerado, tituloTexto:payload.tituloTexto, generoTextual:payload.generoTextual, tema:payload.tema, isDemo:true });
    Teacher.editingLesson=null; Teacher.tab="licoes";
    toast("Lição de teste criada (modo demo — não salva na nuvem). ✅");
    render();
    return;
  }
  toast("Salvando...");
  try{
    // `L.id` pode já existir numa lição NOVA (id gerado ao anexar material) — por isso
    // usamos `_persistido` (e não a presença de id) para decidir criar vs. editar.

      await db.collection("licoes").doc(L.id).set({
        ...payload,
        resumoIA: "",
        explicacoes: firebase.firestore.FieldValue.delete()
      }, { merge:true });
    } else { // nova (grava no id pré-gerado, se houver, senão cria um novo)
      payload.resumoIA = "";
      payload.criadoEm = firebase.firestore.FieldValue.serverTimestamp();
      if(L.id){ await db.collection("licoes").doc(L.id).set(payload); }
      else { const ref = await db.collection("licoes").add(payload); L.id = ref.id; }
    }
    L._persistido = true;

    delete resumoCache[L.id];
    delete historiaCache[L.id]; // relê a história salva; o professor regenera se mudou as questões
    if(L.id) limparLicaoGerada(L.id);
    // atualiza o estado local (remove de onde estava e re-adiciona na disciplina atual)
    removeLicaoLocal(L.id);

// Escopo do professor: turmas (letras A–F) + anos/séries que ele leciona.
function escopoProfessor(prof){
  const p = prof || PROFESSOR || {};
  return {
    turmas: Array.isArray(p.turmas) ? p.turmas : [],
    anos:   Array.isArray(p.anos)   ? p.anos   : [],
  };
}
// O escopo é considerado COMPLETO só quando o professor tem turmas E anos.
// Sem isso não dá para identificar as turmas dele — e NÃO usamos fallback
// (mostrar todos), pois vazaria alunos de outros anos/turmas.
function escopoCompleto(prof){
  const e = escopoProfessor(prof);
  return e.turmas.length>0 && e.anos.length>0;
}
// Um aluno está no escopo do professor quando a LETRA da turma E o ANO batem.
// Comparação normalizada (norm) para tolerar acentos/maiúsculas/espaços.
// Se o escopo do professor estiver incompleto, NINGUÉM entra (sem fallback).
function alunoNoEscopo(aluno, prof){
  const e = escopoProfessor(prof);
  if(!e.turmas.length || !e.anos.length) return false;
  const turmaOk = e.turmas.some(t=>norm(t)===norm(aluno.turma));
  const anoOk   = e.anos.some(a=>norm(a)===norm(aluno.ano));
  return turmaOk && anoOk;
}
// Uma LIÇÃO está no escopo do professor quando ANO e TURMA batem com o que ele leciona.
// Regra (lado do professor): campo vazio na lição = "Todos os anos"/"Todas as turmas" =
// curinga (aparece para todos). Uma lição de um ano específico (ex.: 1º ano) NÃO aparece
// para um professor que não leciona esse ano. Escopo incompleto do professor → nada.
function licaoNoEscopoProfessor(l, prof){
  const e = escopoProfessor(prof);
  if(!e.turmas.length || !e.anos.length) return false;
  const anoL=norm(l.ano), turmaL=norm(l.turma);
  const okAno   = anoL===""  || e.anos.some(a=>norm(a)===anoL);
  const okTurma = turmaL==="" || e.turmas.some(t=>norm(t)===turmaL);
  return okAno && okTurma;
}
// % de acertos de um registro de progresso (prefere o campo salvo; senão calcula).
function pctDoProg(p){
  if(typeof p.percentualAcertos === "number") return p.percentualAcertos;
  return p.total>0 ? (p.acertos/p.total*100) : 0;
}

function periodoLimiteSeg(p){
  if(p==="7")  return Math.floor(Date.now()/1000) - 7*86400;
  if(p==="30") return Math.floor(Date.now()/1000) - 30*86400;
  return null;
}
// Aplica os filtros (turma/disciplina/período) e devolve alunos + progresso filtrados.
function rendimentoFiltrado(){
  const P=Teacher.prog, limite=periodoLimiteSeg(P.fPeriodo);
  const alunos = P.alunos.filter(a=> !P.fTurma || a.turma===P.fTurma);
  const idSet={}; alunos.forEach(a=> idSet[a.id]=true);
  const prog = P.progresso.filter(p=>{
    if(!idSet[p.alunoId]) return false;
    if(P.fDisc && p.disciplina!==P.fDisc) return false;
    if(limite && p.concluidoEm && p.concluidoEm.seconds && p.concluidoEm.seconds<limite) return false;
    return true;
  });
  return { alunos, prog };
}

  SUBJECTS.forEach(s=>{ if(discId && s.id!==discId) return; n += (DATA[s.id]||[]).filter(l=>licaoVisivelPara(l,aluno)).length; });
  return n;
}

  if(P.carregando) return `<div class="ia-loading" style="color:#9b59b6;padding:30px 0"><span class="ia-spinner"></span> Carregando rendimento...</div>`;
  const turmas = (PROFESSOR && Array.isArray(PROFESSOR.turmas)) ? PROFESSOR.turmas : [];

  const filtros = `
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <div style="flex:1;min-width:120px">
        <label>Turma</label>
        <select onchange="App.setProgTurma(this.value)">
          <option value="">Todas</option>
          ${turmas.map(t=>`<option value="${esc(t)}" ${P.fTurma===t?'selected':''}>Turma ${esc(t)}</option>`).join("")}
        </select>
      </div>
      <div style="flex:1;min-width:120px">
        <label>Disciplina</label>
        <select onchange="App.setProgDisc(this.value)">
          <option value="">Todas</option>
          ${SUBJECTS.map(s=>`<option value="${s.id}" ${P.fDisc===s.id?'selected':''}>${s.icon} ${esc(s.nome)}</option>`).join("")}
        </select>
      </div>
      <div style="flex:1;min-width:120px">
        <label>Período</label>
        <select onchange="App.setProgPeriodo(this.value)">
          <option value="todos" ${P.fPeriodo==='todos'?'selected':''}>Todo o período</option>
          <option value="7" ${P.fPeriodo==='7'?'selected':''}>Últimos 7 dias</option>
          <option value="30" ${P.fPeriodo==='30'?'selected':''}>Últimos 30 dias</option>
        </select>
      </div>
    </div>
    <button class="btn gray small" style="width:100%;margin:4px 0 6px" onclick="App.recarregarRendimento()">🔄 Atualizar dados</button>`;

  if(P.erro) return filtros + `<div class="ia-erro">⚠️ ${esc(P.erro)}</div>`;

  // Escopo incompleto: sem turmas E/OU anos cadastrados não dá para saber quais alunos
  // são das turmas do professor. Orienta a atualizar o perfil — NUNCA mostra todos.
  const e0 = escopoProfessor(PROFESSOR);
  if(!e0.turmas.length || !e0.anos.length){
    const faltando=[];
    if(!e0.turmas.length) faltando.push("as <b>turmas</b>");
    if(!e0.anos.length)   faltando.push("os <b>anos/séries</b>");
    return filtros + `<div class="empty"><div class="em">⚙️</div>
      <p><b>Complete seu perfil para ver o rendimento.</b><br>
      Você ainda não cadastrou ${faltando.join(" e ")} que leciona. Sem essa informação
      não é possível identificar quais alunos são das suas turmas.</p>
      <button class="btn" style="margin-top:12px" onclick="App.teacherTab('conta')">👤 Atualizar meu perfil</button>
    </div>`;
  }

  if(!P.alunos.length){
    const escopoTxt = `turmas ${e0.turmas.map(esc).join(", ")} • anos ${e0.anos.map(esc).join(", ")}`;
    return filtros + `<div class="empty"><div class="em">👥</div><p>Nenhum aluno encontrado no seu escopo (${escopoTxt}).<br>Os alunos aparecem aqui após se cadastrarem no mesmo ano e turma.</p></div>`;
  }

  const { alunos, prog } = rendimentoFiltrado();

  // ----- Resumo -----
  const totConcl = prog.length;
  const comTotal = prog.filter(p=>p.total>0);
  const mediaAcertos = comTotal.length ? Math.round(comTotal.reduce((a,p)=>a + pctDoProg(p),0)/comTotal.length) : 0;
  // provas corrigidas (corretor) no escopo, respeitando o filtro de disciplina
  const idsAlunos={}; alunos.forEach(a=> idsAlunos[a.id]=true);
  const correcoes=(P.correcoes||[]).filter(c=> idsAlunos[c.alunoId] && (!P.fDisc || c.disciplina===P.fDisc));
  const provasPorAluno={}; correcoes.forEach(c=>{ provasPorAluno[c.alunoId]=(provasPorAluno[c.alunoId]||0)+1; });
  const mediaProvas = correcoes.length ? (correcoes.reduce((a,c)=>a + (c.notaFinal/((c.notaMaxima)||10)*10),0)/correcoes.length) : 0;
  const resumo = `<div class="stat-row" style="margin:10px 0 4px">
    <div class="stat-pill" style="background:#ede7f6;color:#5e35b1"><div class="v">${alunos.length}</div><div class="l">Alunos</div></div>
    <div class="stat-pill" style="background:#e3f2fd;color:#1565c0"><div class="v">${totConcl}</div><div class="l">Lições feitas</div></div>
    <div class="stat-pill" style="background:#e8f5e9;color:#2e7d32"><div class="v">${mediaAcertos}%</div><div class="l">Média acertos</div></div>
  </div>
  ${correcoes.length?`<div class="stat-row" style="margin:0 0 4px">
    <div class="stat-pill" style="background:#f3e5f5;color:#8e24aa"><div class="v">📷 ${correcoes.length}</div><div class="l">Provas corrigidas</div></div>
    <div class="stat-pill" style="background:#fff3e0;color:#e65100"><div class="v">${mediaProvas.toFixed(1)}</div><div class="l">Média das provas</div></div>
  </div>`:''}`;

  // ----- Gráfico de barras: % de conclusão por disciplina (turma) -----
  const discList = P.fDisc ? SUBJECTS.filter(s=>s.id===P.fDisc) : SUBJECTS;
  let barras = discList.map(s=>{
    let possiveis=0; alunos.forEach(a=> possiveis += (DATA[s.id]||[]).filter(l=>licaoVisivelPara(l,a)).length);
    const feitas = prog.filter(p=>p.disciplina===s.id).length;
    const pct = possiveis ? Math.round(feitas/possiveis*100) : 0;
    if(possiveis===0) return "";
    return `<div style="margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:3px">
        <span>${s.icon} ${esc(s.nome)}</span><b style="color:${s.cor}">${pct}%</b></div>
      <div class="prog-bar-mini"><div style="width:${pct}%;background:${s.cor}"></div></div>
    </div>`;
  }).join("");
  if(!barras.trim()) barras = `<p style="color:var(--gray-d);font-size:13px">Sem lições cadastradas para estas turmas ainda.</p>`;
  const grafico = `<div class="sec-title">Conclusão por disciplina</div><div class="card" style="cursor:default">${barras}</div>`;

  // ----- Ranking por XP -----
  const rank = alunos.slice().sort((a,b)=> (b.xpTotal||0)-(a.xpTotal||0));
  const medalha=["🥇","🥈","🥉"];
  const ranking = `<div class="sec-title">🏆 Ranking por XP</div>` + rank.map((a,i)=>`
    <div class="t-lesson-row">
      <div style="width:30px;text-align:center;font-weight:800">${medalha[i]||(i+1)}</div>
      <div class="info"><div class="t">${esc(a.nome)}</div><div class="d">Turma ${esc(a.turma||'-')} • ${esc(a.ano||'')}</div></div>
      <b style="color:#9b59b6">⭐ ${a.xpTotal||0}</b>
    </div>`).join("");

  // ----- Lista de alunos: % concluído e média de acertos -----
  const lista = `<div class="sec-title">Alunos (${alunos.length})</div>` + alunos.slice().sort((a,b)=>(a.nome||'').localeCompare(b.nome||'')).map(a=>{
    const pAluno = prog.filter(p=>p.alunoId===a.id);
    const possiveis = totalLicoesAluno(a, P.fDisc||null);
    const feitas = pAluno.length;
    const pct = possiveis ? Math.round(feitas/possiveis*100) : 0;
    const ct = pAluno.filter(p=>p.total>0);
    const acc = ct.length ? Math.round(ct.reduce((s,p)=>s+pctDoProg(p),0)/ct.length) : 0;
    return `<div class="card" style="cursor:default">
      <div style="display:flex;align-items:center;gap:10px">
        <div style="flex:1"><b>${esc(a.nome)}</b>
          <div style="font-size:12px;color:var(--gray-d)">Turma ${esc(a.turma||'-')} • ⭐ ${a.xpTotal||0} XP • ${feitas}/${possiveis} lições • ✅ ${acc}% acertos${provasPorAluno[a.id]?(' • 📷 '+provasPorAluno[a.id]+' prova(s)'):''}</div></div>
        <b style="color:#9b59b6">${pct}%</b>
      </div>
      <div class="prog-bar-mini"><div style="width:${pct}%;background:#9b59b6"></div></div>
      <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap">
        <button class="btn gray small" style="flex:1;min-width:130px" onclick="App.redefinirSenhaAluno('${a.id}')">🔑 Redefinir senha</button>
        <button class="btn orange small" style="flex:1;min-width:130px" onclick="App.zerarProgressoAluno('${a.id}')">🔄 Zerar Progresso</button>
        <button class="btn red small" style="flex:1;min-width:130px" onclick="App.removerAluno('${a.id}')">🗑️ Remover</button>
      </div>
    </div>`;
  }).join("");

  return filtros + resumo + grafico + ranking + lista;
}

function premForm(){

// Carrega as premiações das turmas do professor.
async function carregarPremiacoesProf(){
  if(DEMO){ // demo: premiações de exemplo (sem Firestore)
    Teacher.prem.lista = [
      { id:"demo_pr_1", nome:"Mestre das Frações", descricao:"Concluiu todas as lições de Matemática", icone:"➗", criterio:"xp", valorMinimo:200, turma:"A" },
      { id:"demo_pr_2", nome:"Leitor Voraz", descricao:"Leu 5 textos de interpretação", icone:"📚", criterio:"licoes", valorMinimo:5, turma:"A" },
      { id:"demo_pr_3", nome:"Craque do Inglês", descricao:"90% de acertos em Inglês", icone:"🇬🇧", criterio:"xp", valorMinimo:150, turma:"A" },
    ];
    Teacher.prem.carregada=true; Teacher.prem.carregando=false; Teacher.prem.erro=""; render(); return;
  }
  Teacher.prem.carregando=true; Teacher.prem.erro=""; render();
  try{
    const turmas=(PROFESSOR && Array.isArray(PROFESSOR.turmas))?PROFESSOR.turmas:[];
    const snap=await db.collection("premiacoes").get();
    const lista=[];
    snap.forEach(d=>{ const p=d.data(); if(!p.turma || turmas.indexOf(p.turma)>=0) lista.push(Object.assign({ id:d.id }, p)); });
    Teacher.prem.lista=lista; Teacher.prem.carregada=true; Teacher.prem.carregando=false; render();
  }catch(e){ Teacher.prem.carregando=false; Teacher.prem.carregada=true; Teacher.prem.erro="Não foi possível carregar as premiações."; render(); }
}
function setPremCriterio(v){
  const f=premForm();
  f.nome=val('pmNome'); f.descricao=val('pmDesc'); f.icone=val('pmIcone');
  f.valorMinimo=val('pmValor'); f.turma=val('pmTurma'); f.expiracao=val('pmExpira');
  f.criterio=v; render();
}
async function criarPremiacao(){
  const nome=val('pmNome').trim(), descricao=val('pmDesc').trim(), icone=(val('pmIcone').trim()||"🏆");
  const criterio=val('pmCriterio')||premForm().criterio, valorMinimo=Number(val('pmValor'))||0;
  const turma=val('pmTurma'), expira=val('pmExpira');
  if(!nome){ toast("Dê um nome à premiação."); return; }
  if(!valorMinimo){ toast("Informe o valor do critério."); return; }
  if(DEMO){ // demo: adiciona só localmente
    Teacher.prem.lista = (Teacher.prem.lista||[]).concat([{ id:"demo_pr_"+Math.random().toString(36).slice(2,7), nome, descricao, icone, criterio, valorMinimo, turma }]);
    Teacher.prem.form=null; toast("Premiação criada (modo demo). 🏆"); render(); return;
  }
  Teacher.prem.salvando=true; render();
  try{
    const payload={ nome, descricao, icone, criterio, valorMinimo, turma };
    if(expira){ payload.expiracaoEm = firebase.firestore.Timestamp.fromDate(new Date(expira+"T23:59:59")); }
    await db.collection("premiacoes").add(Object.assign({}, payload, { criadoEm: firebase.firestore.FieldValue.serverTimestamp() }));
    Teacher.prem.form=null; Teacher.prem.salvando=false; Teacher.prem.carregada=false;
    toast("Premiação criada! 🏆");
    carregarPremiacoesProf();
  }catch(e){ Teacher.prem.salvando=false; toast("Erro ao salvar premiação."); render(); }
}
async function excluirPremiacao(id){
  if(!confirm("Excluir esta premiação?")) return;
  if(DEMO){ Teacher.prem.lista=Teacher.prem.lista.filter(p=>p.id!==id); toast("Premiação excluída (modo demo)."); render(); return; }
  try{
    await db.collection("premiacoes").doc(id).delete();
    Teacher.prem.lista=Teacher.prem.lista.filter(p=>p.id!==id);
    toast("Premiação excluída."); render();
  }catch(e){ toast("Erro ao excluir."); }
}

    <label>Turma alvo</label>

    <label>Data de expiração (opcional)</label><input id="pmExpira" type="date" value="${esc(f.expiracao||'')}">

  const lista = P.lista.length ? P.lista.map(p=>{

// --- ABA: minha conta (editar turmas/disciplinas da conta existente) ---
function teacherContaTab(){
  const C=Teacher.conta;
  // mostra as letras padrão A–F + quaisquer turmas legadas já na conta (ex.: "5 ano"),
  // para que turmas antigas em formato diferente possam ser DESMARCADAS e removidas.
  const todasTurmas = TURMAS_LETRAS.slice();
  C.turmas.forEach(t=>{ if(todasTurmas.indexOf(t)<0) todasTurmas.push(t); });
  const turmaChips = `<div style="display:flex;flex-wrap:wrap">` + todasTurmas.map(t=>{
    const on=C.turmas.indexOf(t)>=0;
    const legada = TURMAS_LETRAS.indexOf(t)<0;
    return `<button type="button" class="btn small ${on?'':'gray'}" style="width:auto;min-width:64px;margin:0 8px 8px 0" onclick="App.toggleContaTurma('${esc(t)}')">${on?'✓ ':''}Turma ${esc(t)}${legada?' ✕':''}</button>`;
  }).join("") + `</div>
    <p style="font-size:12px;color:#999;margin:-2px 0 6px">Turmas marcadas com ✕ são antigas (fora do padrão A–F). Toque para desmarcar e salve para removê-las.</p>`;
  const discChips = SUBJECTS.map(s=>{
    const on=C.disc.indexOf(s.id)>=0;
    return `<button type="button" class="opt" style="margin-bottom:8px;${on?'border-color:var(--blue);background:#ddf4ff;color:#1899d6':''}" onclick="App.toggleContaDisc('${s.id}')">
      <span>${s.icon} ${esc(s.nome)}</span><span style="margin-left:auto">${on?'✓':''}</span></button>`;
  }).join("");
  const btn = C.salvando
    ? `<button class="btn" disabled><span class="ia-spinner" style="width:18px;height:18px;border-color:rgba(255,255,255,.4);border-top-color:#fff;vertical-align:middle"></span> Salvando...</button>`
    : `<button class="btn" onclick="App.salvarConta()">💾 Salvar alterações</button>`;
  return `<div style="text-align:center;margin-bottom:6px">
      <div style="font-size:18px;font-weight:800">${esc((PROFESSOR&&PROFESSOR.nome)||'')}</div>
      <div style="color:#777;font-size:13px">${esc((PROFESSOR&&PROFESSOR.email)||'')}</div>
    </div>
    <div class="sec-title">Turmas que leciona</div>
    ${turmaChips}
    <div class="sec-title">Anos / séries que leciona</div>
    ${anosChipsHtml(C.anos, 'toggleContaAno')}
    <p style="font-size:12px;color:#999;margin:-2px 0 6px">O rendimento mostra apenas alunos cujo <b>ano e turma</b> você leciona. Marque os anos para não ver alunos de outras séries.</p>
    <div class="sec-title">Disciplinas que leciona</div>
    ${discChips}
    ${btn}
    <p style="font-size:12px;color:#999;margin-top:8px">As turmas definidas aqui aparecem ao criar lições (campo "Turma") e no painel de rendimento. Use o mesmo formato de letra que os alunos (A, B, C…).</p>`;
}
function toggleContaTurma(t){ const a=Teacher.conta.turmas; const i=a.indexOf(t); if(i>=0)a.splice(i,1); else a.push(t); render(); }
function toggleContaAno(v){ const a=Teacher.conta.anos; const i=a.indexOf(v); if(i>=0)a.splice(i,1); else a.push(v); render(); }
function toggleContaDisc(id){ const a=Teacher.conta.disc; const i=a.indexOf(id); if(i>=0)a.splice(i,1); else a.push(id); render(); }
async function salvarConta(){
  const turmas=Teacher.conta.turmas.slice().sort(), anos=Teacher.conta.anos.slice(), disciplinas=Teacher.conta.disc.slice();
  if(!turmas.length){ toast("Selecione ao menos uma turma."); return; }
  if(!anos.length){ toast("Selecione ao menos um ano/série que você leciona."); return; }
  if(!disciplinas.length){ toast("Selecione ao menos uma disciplina."); return; }
  if(!PROFESSOR || !PROFESSOR.id){ toast("Sessão inválida. Entre novamente."); return; }
  if(DEMO){ PROFESSOR.turmas=turmas; PROFESSOR.anos=anos; PROFESSOR.disciplinas=disciplinas; toast("Conta atualizada (modo demo — não salva na nuvem). ✅"); render(); return; }
  Teacher.conta.salvando=true; render();
  try{
    await db.collection("professores").doc(PROFESSOR.id).set({ turmas, anos, disciplinas }, { merge:true });
    PROFESSOR.turmas=turmas; PROFESSOR.anos=anos; PROFESSOR.disciplinas=disciplinas;
    Teacher.conta.salvando=false; toast("Conta atualizada! ✅"); render();
  }catch(e){ Teacher.conta.salvando=false; toast("Erro ao salvar. Verifique a conexão."); render(); }
}

const CORRETOR_JSON_FORMATO =
`Retorne APENAS um JSON válido (aspas duplas), sem texto ao redor, no formato exato:
{"totalQuestoes":0,"questoesCorretas":0,"questoesIncorretas":0,"questoesParciais":0,"notaFinal":0,"notaMaxima":0,"percentualAcerto":0,"conceito":"Excelente|Ótimo|Bom|Regular|Insuficiente","questoes":[{"numero":1,"respostaAluno":"B) O denominador","respostaCorreta":"O denominador","status":"correta|incorreta|parcial|em_branco","pontuacao":0,"pontuacaoMaxima":0,"observacao":"comentário do professor"}],"feedbackGeral":"análise em 2-3 frases","pontosMelhoria":["..."],"pontosForca":["..."]}`;
// Conteúdo textual de uma resposta, SEM o rótulo. Se sobrar só uma letra A-D (ou vazio),
// significa que a IA mandou apenas o label — então NÃO há conteúdo comparável (retorna "").
function conteudoResp(raw){
  let t=String(raw||"").replace(/^\s*[A-Da-d]\s*[\)\.\-:]\s*/,"").trim();
  if(/^[A-Da-d]$/.test(t)) t="";           // ex.: "D" isolado → não é conteúdo
  return norm(t);
}
// Extrai só o rótulo (A/B/C/D) de "B) O denominador" ou de um "B" isolado.
function labelDe(s){
  s=String(s||"").trim();
  const m=s.match(/^([A-Da-d])\s*[\)\.\-:]/); if(m) return m[1].toUpperCase();
  if(/^[A-Da-d]$/.test(s)) return s.toUpperCase();
  return "";
}
// Compara a resposta do aluno com a correta pelo CONTEÚDO (nunca pelo label A/B/C/D).
function respostasBatem(alunoRaw, corretaRaw){
  const a=conteudoResp(alunoRaw), c=conteudoResp(corretaRaw);
  if(!a || !c) return false;
  if(a===c) return true;
  return c.length>=2 && (a.indexOf(c)>=0 || c.indexOf(a)>=0);
}
// Converte "C, B, D, B, B" em ["C","B","D","B","B"].
function parseGabarito(s){ return (String(s||"").toUpperCase().match(/[A-D]/g)) || []; }
// Decide se a questão está correta. REGRA PRINCIPAL = conteúdo; label só como fallback
// (quando a IA não devolveu texto comparável) usando o gabarito oficial por label.
function avaliarQuestaoCorrecao(q, gabLabel){
  const cA=conteudoResp(q.respostaAluno), cC=conteudoResp(q.respostaCorreta);
  const lA=labelDe(q.respostaAluno), lC=gabLabel || labelDe(q.respostaCorreta);
  console.log("[Corretor] Q"+(q.numero||"?")+" | conteúdo aluno:", JSON.stringify(cA), "| conteúdo correto:", JSON.stringify(cC), "| iguais:", (!!cA&&!!cC&&respostasBatem(q.respostaAluno,q.respostaCorreta)), "| label aluno:", lA, "| label gabarito:", lC);
  if(cA && cC) return respostasBatem(q.respostaAluno, q.respostaCorreta); // 1) por CONTEÚDO
  if(lA && lC) return lA===lC;                                           // 2) fallback por label (mesma prova)
  return null; // indeterminado → mantém o que a IA disse
}

// ---- captura/compressão de imagem ----
// Redimensiona para no máx 1024px (mantendo proporção) e comprime em JPEG (~<1MB).
function comprimirImagem(file, cb){
  const reader=new FileReader();
  reader.onload=function(){
    const img=new Image();
    img.onload=function(){
      let w=img.width, h=img.height; const max=1024;
      if(w>max || h>max){ if(w>=h){ h=Math.round(h*max/w); w=max; } else { w=Math.round(w*max/h); h=max; } }
      try{
        const cv=document.createElement("canvas"); cv.width=w; cv.height=h;
        cv.getContext("2d").drawImage(img,0,0,w,h);
        let q=0.85, dataUrl=cv.toDataURL("image/jpeg", q);
        // reduz a qualidade até o base64 caber em ~1MB decodificado (limite prático da API)
        while(dataUrl.length>1300000 && q>0.4){ q-=0.15; dataUrl=cv.toDataURL("image/jpeg", q); }
        cb(dataUrl);
      }catch(e){ cb(null); }
    };
    img.onerror=function(){ cb(null); };
    img.src=reader.result;
  };
  reader.onerror=function(){ cb(null); };
  reader.readAsDataURL(file);
}

// ---- normalização/correção ----
function normalizarCorrecao(r, valorTotal, gabLabels){
  const qs=Array.isArray(r.questoes)?r.questoes:[];
  gabLabels = Array.isArray(gabLabels)?gabLabels:[];
  let somaMax=0, soma=0, cor=0, inc=0, par=0, br=0;
  qs.forEach(function(q,i){
    q.numero = q.numero || (i+1);
    q.pontuacaoMaxima = Number(q.pontuacaoMaxima) || (valorTotal/(qs.length||1));
    q.pontuacao = Number(q.pontuacao)||0;
    const st=String(q.status||"").toLowerCase();
    q.status = /branco/.test(st) ? "em_branco" : (/parcial/.test(st) ? "parcial" : (/incorret/.test(st) ? "incorreta" : (/corret/.test(st) ? "correta" : "incorreta")));
    const gabLabel = gabLabels[(q.numero||i+1)-1] || "";
    // Se veio gabarito oficial por label e a IA não trouxe o texto correto, completa-o.
    if(gabLabel && !labelDe(q.respostaCorreta)) q.respostaCorreta = gabLabel+") "+String(q.respostaCorreta||"").replace(/^\s*[A-Da-d]\s*[\)\.\-:]\s*/,"").trim();
    // REVALIDAÇÃO — conteúdo é a regra principal; label (gabarito oficial) é o fallback.
    // (Não mexe em respostas parciais nem em branco.)
    if(q.status!=="em_branco" && q.status!=="parcial"){
      const res = avaliarQuestaoCorrecao(q, gabLabel);
      if(res!==null){ q.status = res ? "correta" : "incorreta"; q.pontuacao = res ? q.pontuacaoMaxima : 0; }
    } else if(q.status==="em_branco"){ q.pontuacao = 0; }
    somaMax+=q.pontuacaoMaxima; soma+=q.pontuacao;
    if(q.status==="correta")cor++; else if(q.status==="parcial")par++; else if(q.status==="em_branco")br++; else inc++;
  });
  // Nota e contagens vêm SEMPRE das questões já revalidadas por conteúdo (não dos totais da IA,
  // que poderiam refletir a comparação errada por label).
  const notaMax = Number(r.notaMaxima)||valorTotal||10;
  let nota = somaMax ? (soma/somaMax*notaMax) : 0;
  nota = Math.round(nota*10)/10;
  const pct = Math.round(notaMax? (nota/notaMax*100) : 0);
  return Object.assign({}, r, {
    totalQuestoes: qs.length || r.totalQuestoes || 0,
    questoesCorretas:cor, questoesIncorretas:inc, questoesParciais:par,
    notaFinal:nota, notaMaxima:notaMax, percentualAcerto:pct, conceito:conceitoDeNota(pct),
    questoes:qs, feedbackGeral:r.feedbackGeral||"",
    pontosMelhoria:Array.isArray(r.pontosMelhoria)?r.pontosMelhoria:[], pontosForca:Array.isArray(r.pontosForca)?r.pontosForca:[]
  });
}
function mensagemErroCorretor(e){
  const m=(e&&e.message)||"";
  if(m==="timeout") return "A correção demorou demais. Algumas questões podem não ter sido lidas — tente novamente com uma foto mais nítida.";
  if(m==="sem_questoes") return "Não consegui identificar questões nesta imagem. Tente uma foto mais próxima e nítida.";
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)) return "Falha ao contatar a IA. Verifique a conexão e a chave configurada.";
  return "A imagem está difícil de ler. Tente fotografar com mais luz e a câmera estável.";
}
async function corrigirProvaIA(meta){
  const subjNome=(subjById(meta.subj)||{}).nome||"";
  const licao = meta.licaoId ? (DATA[meta.subj]||[]).find(function(l){return l.id===meta.licaoId;}) : null;
  const cab = `Valor total da prova: ${meta.valor} pontos. Disciplina: ${subjNome}.`;
  const gabLabels = meta.gabLabels || [];
  // Gabarito oficial digitado pelo professor (por label): elimina a inferência da IA.
  const blocoGabaritoManual = gabLabels.length ? `
GABARITO OFICIAL DESTA PROVA (use exatamente estas alternativas como corretas):
${gabLabels.map(function(l,i){ return `Questão ${i+1}: alternativa ${l}`; }).join("\n")}
Para cada questão: leia a imagem, encontre a alternativa cujo label é o indicado acima e use o TEXTO dela como resposta correta (preencha "respostaCorreta" com "label) texto"). Não invente outra resposta.
` : "";
  let prompt;
  if(licao){
    const pub=descreverPublicoLicao(licao);
    const gab=(licao.exercicios||[]).map(function(ex,i){
      const correta = ex.tipo==="fill" ? (ex.resposta||"") : ((ex.opcoes&&ex.opcoes[ex.correta])||"");
      return `${i+1}. ${ex.enunciado} → Resposta correta: ${correta}`;
    }).join("\n");
    prompt =
`Você é um professor corretor experiente do ${pub.ano} do ${nomeNivel(pub.nivelId)}.
Analise a imagem desta prova/atividade respondida por um aluno. ${cab}

Gabarito de referência (o texto após "Resposta correta:" é a RESPOSTA CORRETA de cada questão):
${gab}
${blocoGabaritoManual}
${CORRETOR_REGRAS_LEITURA}

Atribua pontuação proporcional ao valor total (${meta.valor}).

${CORRETOR_JSON_FORMATO}`;
  } else {
    prompt =
`Você é um professor corretor experiente. Analise a imagem desta prova/atividade respondida por um aluno. ${cab}
${blocoGabaritoManual || "Não há gabarito fornecido: INFIRA a resposta correta pelo contexto educacional (assunto/nível visível na prova; se houver gabarito na imagem, use-o), com muito cuidado — verifique de fato qual alternativa está correta."}
${CORRETOR_REGRAS_LEITURA}

Atribua pontuação proporcional ao valor total (${meta.valor}).

${CORRETOR_JSON_FORMATO}`;
  }
  const content=[{ type:"text", text:prompt }];
  Teacher.corretor.imagens.forEach(function(u){ content.push({ type:"image_url", image_url:{ url:u } }); });
  const txt = await chamarIAMensagens([{ role:"user", content:content }], 45000);
  const r = parseJsonObjIA(txt);
  if(!r || !Array.isArray(r.questoes) || !r.questoes.length) throw new Error("sem_questoes");
  return normalizarCorrecao(r, meta.valor, gabLabels);
}
async function corrigirProva(){
  syncCorretorInputs();
  const C=Teacher.corretor;
  if(!C.imagens.length){ toast("Adicione ao menos uma foto da prova."); return; }
  const temIA = iaConfigurada();
  if(!temIA && !DEMO){ C.erro="Configure a chave da IA nas configurações do administrador para usar o corretor."; render(); return; }
  const aluno=(C.alunos||[]).find(function(a){return a.id===C.alunoId;})||null;
  C.meta={ alunoId:C.alunoId, alunoNome: aluno?aluno.nome:(DEMO?"Aluno(a) da Apresentação":"Aluno(a)"),
    subj:C.subj, licaoId:C.licaoId, valor:parseFloat(C.valor)||10, gabLabels:parseGabarito(C.gabarito), dataStr:dataHojeBR() };
  C.erro=""; C.carregando=true; C.view="loading"; C.msgIdx=0; render(); iniciarRotacaoCorretor();

  // DEMO sem IA → resultado fictício após ~2.6s (mantém a animação de loading)
  if(!temIA && DEMO){
    setTimeout(function(){ pararRotacaoCorretor();
      C.resultado=correcaoDemoResultado(); C.ehDemo=true; C.carregando=false; C.view="result"; render();
    }, 2600);
    return;
  }
  try{
    const r = await corrigirProvaIA(C.meta);
    pararRotacaoCorretor(); C.resultado=r; C.ehDemo=false; C.carregando=false; C.view="result"; render();
  }catch(e){
    pararRotacaoCorretor(); C.carregando=false;
    if(DEMO){ C.resultado=correcaoDemoResultado(); C.ehDemo=true; C.view="result"; render(); return; } // demo nunca mostra erro de API
    C.view="form"; C.erro=mensagemErroCorretor(e); render();
  }
}

function compartilharCorrecao(){
  const C=Teacher.corretor, r=C.resultado, m=C.meta||{}; if(!r) return;
  const texto="Nota: "+r.notaFinal+"/"+r.notaMaxima+" | Acertos: "+r.percentualAcerto+"% | Conceito: "+r.conceito;
  if(navigator.share){ navigator.share({ title:"Resultado de "+(m.alunoNome||"aluno"), text:texto, url:location.href }).catch(function(){}); }
  else { try{ navigator.clipboard.writeText(texto); toast("Resultado copiado!"); }catch(_){ toast(texto); } }
}
function corrigirOutra(){ const C=Teacher.corretor; C.view="form"; C.imagens=[]; C.resultado=null; C.erro=""; C.ehDemo=false; C.meta=null; render(); }
function abrirCorrecao(id){
  const c=(Teacher.corretor.historico||[]).find(function(x){return x.id===id;}); if(!c) return;
  if(c.questoes && c.questoes.length){
    Teacher.corretor.resultado=normalizarCorrecao(c, c.notaMaxima||10);
    Teacher.corretor.meta={ alunoNome:c.alunoNome, subj:c.disciplina, dataStr:c.dataStr, valor:c.notaMaxima, licaoId:c.licaoId||"" };
    Teacher.corretor.ehDemo=!!(DEMO && String(id).indexOf("demo_c")===0);
    Teacher.corretor.imagens=[]; Teacher.corretor.view="result"; render();
  } else {
    toast(`${c.alunoNome||'Aluno'} — ${(+c.notaFinal).toFixed(1)}/${(+ (c.notaMaxima||10)).toFixed(0)} • ${c.conceito||''}`);
  }
}
function excluirCorrecao(id){
  if(!confirm("Excluir esta correção?")) return;
  const C=Teacher.corretor;
  if(DEMO){
    let arr=[]; try{ arr=JSON.parse(sessionStorage.getItem("estudamais_demo_correcoes")||"[]")||[]; }catch(_){}
    arr=arr.filter(function(x){return x.id!==id;}); try{ sessionStorage.setItem("estudamais_demo_correcoes", JSON.stringify(arr)); }catch(_){}
    C.historico=(C.historico||[]).filter(function(x){return x.id!==id;}); render(); return;
  }
  if(!db){ return; }
  db.collection("correcoes").doc(id).delete().then(function(){ C.historico=(C.historico||[]).filter(function(x){return x.id!==id;}); toast("Correção excluída."); render(); }).catch(function(){ toast("Erro ao excluir."); });
}

// Restaura o usuário logado (aluno/professor) a partir da sessão local.
async function restaurarSessao(){
  if(!SESSAO){ State.tela="landing"; return; }
  try{
    if(SESSAO.tipo==="aluno"){
      const doc = await db.collection("alunos").doc(SESSAO.id).get();
      if(doc.exists){ const data=Object.assign({}, doc.data(), { id:doc.id }); delete data.criadoEm; definirAlunoLogado(data); State.tela="home"; inicializarAluno(); return; }
    } else if(SESSAO.tipo==="professor"){
      const doc = await db.collection("professores").doc(SESSAO.id).get();
      if(doc.exists){ PROFESSOR=Object.assign({}, doc.data(), { id:doc.id }); State.tela="teacher"; Teacher.tab="licoes"; return; }
    }
    // doc não existe mais → volta ao landing
    SESSAO=null; salvarSessao(); State.tela="landing";
  }catch(e){
    // sem rede: tenta o cache local do aluno
    if(SESSAO.tipo==="aluno"){
      try{ const c=JSON.parse(localStorage.getItem(ALUNO_CACHE_KEY)||"null"); if(c && c.id===SESSAO.id){ definirAlunoLogado(c.doc); State.tela="home"; return; } }catch(_){}
    }
    State.tela="landing";
  }
}

// Boot — IA/sessão do localStorage; lições/contas do Firestore
async function boot(){
  loadIA();
  carregarSessao();
  SUBJECTS.forEach(s=> DATA[s.id]=DATA[s.id]||[]);
  // MODO DEMO: carregamento rápido e offline; nada de Firestore obrigatório.
  if(detectarDemo()){
    mostrarCarregando("Carregando demonstração...");
    carregarDemoLicoes();                    // lições locais (instantâneo)
    // IA é opcional no demo: tenta carregar a chave, mas não bloqueia se falhar/offline
    try{ initFirebase(); await carregarChaveIA(); }catch(_){}
    State.tela="demoWelcome"; render();
    return;
  }
  mostrarCarregando("Carregando...");
  try{
    initFirebase();
    await carregarChaveIA();   // chave da OpenAI compartilhada (Firestore)
    await ouvirLicoes();       // listener em tempo real; resolve no primeiro snapshot
    await restaurarSessao();   // recarrega aluno/professor logado, se houver
    // veio de uma saída do modo demo? abre direto o cadastro/login pedido
    try{ const d=sessionStorage.getItem("demoDestino"); if(d){ sessionStorage.removeItem("demoDestino"); if(!SESSAO && (d==="cadastroAluno"||d==="loginAluno"||d==="landing")){ State.tela=d; if(d!=="landing") toast("Gostou do EstudaMais? Crie sua conta grátis!"); } } }catch(_){}
    render();
  }catch(e){
    mostrarErroConexao();
  }
}
boot();
